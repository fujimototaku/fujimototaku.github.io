<a class="skip-link" href="#main">{{ site.data.ui.header.skip_link }}</a>
<header class="site-header">
  <p class="eyebrow">{{ site.data.home.retro.eyebrow }}</p>
  <h1><span class="rainbow">{{ site.data.site.title }}</span></h1>
  <p class="site-description">{{ site.data.site.description | newline_to_br }}</p>
  <p class="real-counter" aria-label="アクセスカウンター">
    <img src="https://hits.sh/fujimototaku.github.io.svg?view=total&amp;style=flat-square&amp;label=COUNTER&amp;extraCount=1000000000&amp;color=28332c&amp;labelColor=222222" alt="アクセスカウンター">
  </p>
</header>

<div class="ticker" aria-label="{{ site.data.ui.header.ticker_aria_label }}">
  <div class="ticker-track">{{ site.data.home.retro.ticker }}</div>
</div>
