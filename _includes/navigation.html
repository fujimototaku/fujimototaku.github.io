<aside class="sidebar" aria-label="サイトメニュー">
  <section class="panel menu-panel">
    <h2>めにゅー</h2>
    <nav>
      <a href="/">■ とっぷ</a>
      <a href="/works/">■ 作品・書店</a>
      <a href="/info/">■ 活動履歴</a>
      <a href="/diary/">■ 日記</a>
      <a href="/contact/">■ お問い合わせ</a>
    </nav>
  </section>

  <section class="panel menu-panel">
    <h2>外部りんく</h2>
    <nav>
      {% for link in site.data.site.external_links %}
      <a href="{{ link.url }}" target="_blank" rel="noopener">◇ {{ link.label }}</a>
      {% endfor %}
    </nav>
  </section>

  {% if page.home %}
  <section class="panel mini-panel">
    <h2>{{ site.data.home.event.label }}</h2>
    <p id="countdown" class="digital">計算中...</p>
  </section>

  <section class="panel mini-panel">
    <h2>3D地球儀</h2>
    <div id="globeViz" aria-label="地球儀"></div>
    <p class="small-note">地球を押すと地図が開きます</p>
  </section>
  {% endif %}

</aside>
