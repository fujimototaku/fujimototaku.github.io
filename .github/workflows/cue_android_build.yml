name: Build Cue Android APK

on:
  push:
    branches:
      - cue-download
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :cue_android:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp cue_android/build/outputs/apk/debug/cue_android-debug.apk Cue-Android.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete cue-android-latest --cleanup-tag -y || true
          gh release create cue-android-latest Cue-Android.apk \
            --title "Cue Android" \
            --notes "Android版Cue。APKをタップしてインストールしてください。" \
            --target "$GITHUB_SHA"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cue-Android
          path: Cue-Android.apk
          retention-days: 1
