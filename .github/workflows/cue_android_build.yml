name: Build Cue Android APK

on:
  push:
    branches:
      - cue-apk-build-actual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :cue_android:assembleDebug --no-daemon
      - name: Prepare artifact
        run: cp cue_android/build/outputs/apk/debug/cue_android-debug.apk Cue-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cue-Android
          path: Cue-Android.apk
          retention-days: 1
