name: Update XAUUSD data
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Download XAU/USD hourly data
        run: |
          python - <<'PY'
          import json, yfinance as yf
          df=yf.download("XAUUSD=X",period="730d",interval="1h",auto_adjust=False,progress=False)
          if df.empty: raise SystemExit("No XAUUSD data returned")
          if hasattr(df.columns,"levels"): df.columns=df.columns.get_level_values(0)
          rows=[]
          for idx,row in df.dropna().iterrows(): rows.append({"ts":idx.isoformat(),"open":float(row["Open"]),"high":float(row["High"]),"low":float(row["Low"]),"close":float(row["Close"])})
          json.dump({"rows":rows,"updated_at":df.index[-1].isoformat()},open("tools/xauusd-lab/data/xauusd-1h.json","w"),separators=(",",":"))
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/xauusd-lab/data/xauusd-1h.json
          git diff --cached --quiet || git commit -m "Update XAU/USD hourly data"
          git push