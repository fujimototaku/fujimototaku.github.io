---
permalink: /time-machine/
---
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TIME</title>
  <link rel="manifest" href="/time-machine/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/time-machine.css">
</head>
<body>
  <main class="tm" data-time-machine>
    <header class="tm-top">
      <div class="tm-logo">TIME</div>
      <button id="tm-now" class="tm-now" type="button" hidden>今へ</button>
    </header>

    <section id="tm-stage" class="tm-stage" aria-live="polite">
      <label class="tm-date-hit">
        <span id="tm-date-label" class="tm-date-label">----</span>
        <input id="tm-date" type="date" aria-label="日付へ移動">
      </label>
      <div id="tm-relative" class="tm-relative">あなたの時間</div>

      <article id="tm-hero" class="tm-hero">
        <div id="tm-source" class="tm-source"></div>
        <h1 id="tm-title">記録を読み込み中</h1>
        <p id="tm-text"></p>
        <img id="tm-image" class="tm-image" alt="" hidden>
      </article>

      <div id="tm-more" class="tm-more"></div>
    </section>

    <footer class="tm-bottom">
      <div class="tm-rail-wrap">
        <input id="tm-range" class="tm-rail" type="range" min="0" max="0" value="0" aria-label="時間を移動">
        <div class="tm-rail-labels">
          <span id="tm-start">----</span>
          <span id="tm-position">NOW</span>
          <span id="tm-end">----</span>
        </div>
      </div>
      <p id="tm-hint" class="tm-hint">左右にスワイプ</p>
    </footer>
  </main>

  <script id="tm-manual-data" type="application/json">{{ site.data.timeline.entries | jsonify }}</script>
  <script id="tm-announcement-data" type="application/json">[
  {% for item in site.data.home.announcements %}
    {
      "date": {{ item.date | replace: "/", "-" | jsonify }},
      "type": "announcement",
      "source": "site",
      "title": {{ item.text | jsonify }},
      "text": "サイトのお知らせ",
      "url": "/",
      "image": ""
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
  ]</script>
  <script id="tm-post-data" type="application/json">[
  {% for post in site.posts %}
    {
      "date": {{ post.date | date: "%Y-%m-%d" | jsonify }},
      "type": "diary",
      "source": "diary",
      "title": {{ post.title | jsonify }},
      "text": {{ post.content | strip_html | strip_newlines | truncate: 220 | jsonify }},
      "url": {{ post.url | jsonify }},
      "image": ""
    }{% unless forloop.last %},{% endunless %}
  {% endfor %}
  ]</script>

  <script src="/assets/time-machine.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/time-machine/sw.js").catch(() => {});
    }
  </script>
</body>
</html>
