<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#130f2b"><title>私設図書館</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#130f2b;color:#17131d}body{overflow-x:hidden;background:radial-gradient(circle at 80px 80px,#ffdf5d 0 36px,transparent 37px),linear-gradient(135deg,#d8f7ff 0 35%,#ff9dc9 35% 62%,#ffe46f 62%)}
.wrap{max-width:880px;margin:auto;padding:14px 12px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.brand{background:#111;color:#fff;padding:10px 13px;border:3px solid #fff;box-shadow:4px 4px 0 #111;font-weight:900;letter-spacing:.08em}.clock{font:900 28px/1 monospace;background:#8cff7a;border:3px solid #111;padding:8px 10px;transform:rotate(1deg)}
.marquee{overflow:hidden;border:3px solid #111;background:#fff;color:#111;margin-bottom:12px;white-space:nowrap}.marquee div{display:inline-block;padding:8px 0;animation:roll 17s linear infinite;font-weight:800}@keyframes roll{to{transform:translateX(-50%)}}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.box{border:3px solid #111;background:#fff;box-shadow:6px 6px 0 rgba(0,0,0,.85);padding:14px}.box h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.12em}.signal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.light{aspect-ratio:1;border-radius:50%;border:3px solid #111;display:grid;place-items:center;font-weight:900;font-size:12px}.light:nth-child(1){background:#ff5656}.light:nth-child(2){background:#ffe45c}.light:nth-child(3){background:#73ff7d}.gauge{height:28px;border:3px solid #111;background:#ddd;position:relative;overflow:hidden}.gauge>i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#111 0 12px,#ff4db8 12px 24px);transition:.3s}.msg{font:900 22px/1.25 Georgia,serif;min-height:84px;display:flex;align-items:center}
.elevator{background:#222;color:#7fff75;border:5px inset #555;font:900 64px/1 monospace;text-align:center;padding:18px 4px}.small{font-size:11px;opacity:.65}.dialwrap{display:grid;place-items:center}.dial{width:150px;height:150px;border-radius:50%;border:10px solid #111;background:conic-gradient(#ff4db8 0 25%,#ffe45c 25% 50%,#72e7ff 50% 75%,#7fff75 75%);position:relative;box-shadow:inset 0 0 0 12px #fff}.dial:after{content:"館長";position:absolute;inset:30px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}.needles{position:absolute;left:50%;top:8px;width:5px;height:62px;background:#111;transform-origin:50% 67px;transform:rotate(var(--r,20deg))}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:3px solid #111;background:#f5f5f5;padding:12px 9px;font:800 14px inherit;box-shadow:3px 3px 0 #111;cursor:pointer}.btn:active{transform:translate(3px,3px);box-shadow:none}.pink{background:#ff79bf}.yellow{background:#ffe457}.green{background:#89ff87}.blue{background:#83e6ff}.black{background:#111;color:#fff}.red{background:#ff4949;color:#fff}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.form input{min-width:0;border:3px solid #111;padding:12px;font:700 15px inherit;background:#fff}.form button{margin:0}
.sky{position:relative;height:190px;background:linear-gradient(#6b55d8,#ec8fd2);border:3px solid #111;overflow:hidden}.moon{position:absolute;width:74px;height:74px;border-radius:50%;background:#fff38a;right:25px;top:18px;border:3px solid #111}.ufo{position:absolute;left:24px;bottom:38px;font-size:58px;animation:fly 5s ease-in-out infinite alternate}@keyframes fly{to{transform:translate(230px,-40px) rotate(8deg)}}.ground{position:absolute;bottom:0;left:0;right:0;height:45px;background:#111;color:#fff;padding:8px;font:12px monospace}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ticket{background:#fff6c8;border:3px dashed #111;padding:12px;min-height:130px;position:relative}.ticket:before{content:"搭乗券";position:absolute;right:8px;top:7px;font:900 10px monospace;opacity:.5}.ticket h3{margin:8px 0 4px;font-size:18px}.ticket .meta{font-size:12px;opacity:.65}.ticket .ops{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px}.ticket .ops button{flex:1;border:2px solid #111;background:#fff;padding:7px;font-weight:800}.ticket .ops .del{flex:0 0 36px;background:#ff6b6b}.empty{grid-column:1/-1;padding:24px;text-align:center;border:3px dashed #111;background:#fff}.spin{animation:spin .7s linear}@keyframes spin{to{transform:rotate(360deg)}}.invert{filter:invert(1) hue-rotate(160deg)}.shake{animation:shake .35s linear}@keyframes shake{25%{transform:translate(8px,-4px)}50%{transform:translate(-8px,4px)}75%{transform:translate(5px,3px)}}
@media(max-width:680px){.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.list{grid-template-columns:1fr}.elevator{font-size:52px}.sky{height:165px}}
</style></head><body><div class="wrap" id="world">
<div class="top"><div class="brand">私設図書館 / たぶん営業中</div><div class="clock" id="clock">88:88</div></div>
<div class="marquee"><div>緊急速報：館内の気圧は正常です　　冷蔵庫は設置されていません　　3階は存在しません　　返却期限は概念です　　緊急速報：館内の気圧は正常です　　冷蔵庫は設置されていません　　3階は存在しません　　返却期限は概念です　　</div></div>
<div class="grid">
<section class="box"><h2>交通管制</h2><div class="signal"><div class="light">停止</div><div class="light">保留</div><div class="light">多分可</div></div><div class="gauge" style="margin-top:10px"><i id="madbar"></i></div><div class="small">無意味度 <b id="mad">0</b>%</div></section>
<section class="box"><h2>エレベーター</h2><div class="elevator" id="floor">B7</div><div class="small">この建物に地下7階はありません</div></section>
<section class="box"><h2>中央気象台</h2><div class="sky"><div class="moon"></div><div class="ufo" id="ufo">🛸</div><div class="ground" id="weather">館内天気：概ね廊下</div></div></section>
<section class="box"><h2>館長の洗濯機</h2><div class="dialwrap"><div class="dial"><div class="needles" id="needle"></div></div></div><div class="controls" style="margin-top:12px"><button class="btn pink" id="spin">脱水</button><button class="btn yellow" id="floorBtn">階を変更</button></div></section>
</div>
<section class="box" style="margin-top:12px"><h2>記録票</h2><div class="form"><input id="title" placeholder="名前"><input id="author" placeholder="よく分からない補足"><button class="btn black" id="add">登録</button></div></section>
<section class="box"><div class="msg" id="message">現在、特に何も起きていません。</div><div class="controls"><button class="btn blue" id="oracle">意味不明な託宣</button><button class="btn green" id="weatherBtn">館内天気を変更</button><button class="btn yellow" id="rename">勝手に改名</button><button class="btn pink" id="passport">搭乗許可</button><button class="btn red" id="alarm">非常ベル</button><button class="btn black" id="invert">現実反転</button></div></section>
<section class="box"><h2>搭乗待合室</h2><div class="list" id="list"></div></section>
</div><script>
(function(){var K='private-library-v4-surreal',old='private-library-v3',items=[];try{items=JSON.parse(localStorage.getItem(K)||localStorage.getItem(old)||'[]');if(!Array.isArray(items))items=[]}catch(e){items=[]}var madness=0;var $=id=>document.getElementById(id);function save(){try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}render()}function say(t,n){$('message').textContent=t;madness=Math.min(100,madness+(n||7));$('mad').textContent=madness;$('madbar').style.width=madness+'%'}function rnd(a){return a[Math.floor(Math.random()*a.length)]}function render(){var l=$('list');l.innerHTML='';if(!items.length){l.innerHTML='<div class="empty">待合室には誰もいません。<br>便もありません。</div>';return}items.slice().reverse().forEach(function(x){var d=document.createElement('div');d.className='ticket';var st=x.status||'unread';var label=st==='read'?'着陸済':st==='reading'?'旋回中':'搭乗待ち';d.innerHTML='<h3></h3><div class="meta"></div><div class="ops"><button class="state"></button><button class="del">×</button></div>';d.querySelector('h3').textContent=x.title||'名称未設定';d.querySelector('.meta').textContent=(x.author||'補足なし')+' / '+label;d.querySelector('.state').textContent=label+' →';d.querySelector('.state').onclick=function(){x.status=st==='unread'?'reading':st==='reading'?'read':'unread';say('状態が変わりましたが、交通への影響はありません。');save()};d.querySelector('.del').onclick=function(){items=items.filter(i=>i.id!==x.id);say('記録を抹消しました。監査は来ません。');save()};l.appendChild(d)})}
$('add').onclick=function(){var t=$('title').value.trim();if(!t)return $('title').focus();items.push({id:Date.now()+Math.random(),title:t,author:$('author').value.trim(),status:'unread'});$('title').value='';$('author').value='';say('登録されました。なぜ登録したのかは不明です。',9);save()};
$('oracle').onclick=function(){say(rnd(['北北西の廊下があなたを見ています。','次の火曜日は存在しない予定です。','黄色いボタンには法的拘束力がありません。','館長は現在、概念としてのみ在席しています。','右から3番目の沈黙を信用しないでください。']),11)};
$('weatherBtn').onclick=function(){var w=rnd(['概ね廊下','局地的に机','午後から天井','湿度：哲学','降水確率：オレンジ','風向：内側']);$('weather').textContent='館内天気：'+w;say('気象条件を「'+w+'」に変更しました。',8)};
$('floorBtn').onclick=function(){var fs=['B7','13½','屋上-2','G','404','月'];$('floor').textContent=rnd(fs);say('エレベーターは物理法則を無視しました。',6)};
$('spin').onclick=function(){var n=$('needle');n.style.setProperty('--r',(Math.floor(Math.random()*720)-360)+'deg');n.classList.remove('spin');void n.offsetWidth;n.classList.add('spin');say('館長を脱水しています。終了予定は未定です。',13)};
$('rename').onclick=function(){if(!items.length)return say('改名対象がいません。');var x=rnd(items),oldn=x.title;x.title=rnd(['第4非常口','木曜日の予備','無音区画','係員室B','未承認の空','青い手続き'])+' '+Math.floor(Math.random()*99);say('「'+oldn+'」は行政上「'+x.title+'」になりました。',12);save()};
$('passport').onclick=function(){if(!items.length)return say('搭乗者がいません。');var x=rnd(items);say('「'+x.title+'」に搭乗許可を出しました。行き先は未設定です。',10)};
$('alarm').onclick=function(){var w=$('world');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');say('非常ベルが鳴りました。非常事態はありません。',15)};
$('invert').onclick=function(){$('world').classList.toggle('invert');say('現実の極性を反転しました。戻す必要は特にありません。',17)};
function tick(){var d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}tick();setInterval(tick,1000);render()})();
</script></body></html>
