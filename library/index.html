(function(){var K='private-library-v5-chaos';var data=[];try{data=JSON.parse(localStorage.getItem(K)||'[]');if(!Array.isArray(data))data=[]}catch(e){}var mad=0,$=id=>document.getElementById(id),rnd=a=>a[Math.floor(Math.random()*a.length)];function save(){try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}render()}function say(t,n){$('msg').textContent=t;mad=Math.min(100,mad+(n||7));$('mad').textContent=mad;$('bar').style.width=mad+'%'}function render(){var r=$('records');r.innerHTML='';if(!data.length){r.innerHTML='<div class="empty">記録なし。<br>しかし監査だけは予定されています。</div>';return}data.slice().reverse().forEach(function(x){var d=document.createElement('div');d.className='record';d.innerHTML='<h3></h3><small></small><div class="ops"><button class="mut">状態変更</button><button class="del">×</button></div>';d.querySelector('h3').textContent=x.name;d.querySelector('small').textContent=(x.memo||'説明拒否')+' / '+(x.state||'未分類');d.querySelector('.mut').onclick=function(){x.state=rnd(['漂流中','行政上は鳥','木曜日扱い','保留の保留','概念','着席済']);say('状態を「'+x.state+'」へ変更しました。根拠はありません。',8);save()};d.querySelector('.del').onclick=function(){data=data.filter(y=>y.id!==x.id);say('記録は消えましたが、責任だけ残りました。',10);save()};r.appendChild(d)})}function tick(){var d=new Date(),h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');$('clock').textContent=Math.random()<.03?'??:??':h+':'+m}tick();setInterval(tick,1000);document.addEventListener('pointermove',function(e){var rect=$('eye').getBoundingClientRect(),x=Math.max(8,Math.min(67,e.clientX-rect.left-15));$('eye').style.setProperty('--x',x+'px');$('watch').textContent=rnd(['見ています','見ていません','たぶん右','対象外'])});$('add').onclick=function(){var n=$('thing').value.trim();if(!n)return $('thing').focus();data.push({id:Date.now()+Math.random(),name:n,memo:$('memo').value.trim(),state:'未分類'});$('thing').value='';$('memo').value='';say('「'+n+'」を何らかの台帳へ登録しました。',9);save()};$('panic').onclick=function(){$('world').classList.toggle('panic');say('UI非常事態を宣
