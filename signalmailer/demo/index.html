<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料デモ｜SignalMailer AI</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}.wrap{max-width:900px;margin:auto;padding:30px 16px 70px}.panel{background:#15181d;border:1px solid #282e37;border-radius:16px;padding:18px;margin-top:16px}input,textarea{width:100%;background:#0f1115;color:#fff;border:1px solid #353d49;border-radius:9px;padding:11px;font:inherit}textarea{min-height:110px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:900;cursor:pointer}.buy{background:#fff;color:#111;text-decoration:none;display:inline-block}.muted{color:#96a0ad}.result{white-space:pre-wrap;background:#0f1115;border-radius:10px;padding:14px;margin-top:12px;line-height:1.7}@media(max-width:680px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="muted">SignalMailer AI / FREE DEMO</div><h1>1社分の営業文を無料で作る</h1><p class="muted">AI API不要の簡易デモです。本番版はCSV最大50社を優先順位づけして一括処理します。</p><section class="panel"><div class="grid"><div><label>会社名</label><input id="company" placeholder="株式会社サンプル"></div><div><label>担当者</label><input id="name" placeholder="田中様"></div><div><label>役職</label><input id="role" placeholder="営業部長"></div><div><label>最近の動き / シグナル</label><input id="signal" placeholder="営業職を10名採用中"></div></div><div style="margin-top:12px"><label>あなたの商品</label><textarea id="offer" placeholder="営業リスト作成から初回文作成までを自動化するサービス"></textarea></div><button class="btn" id="go" style="margin-top:12px">文面を作る</button><div id="out" class="result" hidden></div></section><section class="panel"><h2>50社まとめて処理する</h2><p class="muted">見込み度スコア、件名、初回文、追客2通をCSVでまとめて出力。</p><a class="btn buy" href="https://buy.stripe.com/test_3cI3cu3TO8Rr4ldejkebu02">ベータ版 ¥4,980</a></section></main><script>const $=x=>document.getElementById(x);$('go').onclick=()=>{const c=$('company').value.trim()||'貴社',n=$('name').value.trim()||'ご担当者様',r=$('role').value.trim(),s=$('signal').value.trim()||'最近の取り組み',o=$('offer').value.trim()||'業務効率化サービス';let score=45;if(s)score+=25;if(/代表|社長|CEO|部長|責任者|役員/i.test(r))score+=20;score=Math.min(score,100);$('out').hidden=false;$('out').textContent=`優先度：${score}/100\n\n件名：${c}の${s.slice(0,20)}について\n\n${n}\n突然のご連絡失礼します。${s}を拝見し、${o}がお役に立てる可能性があると思いご連絡しました。もし現在の優先事項に近ければ、要点だけ短く共有できます。\n\n追客1：先日の件、もし今期のテーマに近ければ具体例だけお送りします。ご不要でしたら返信不要です。\n\n追客2：最後に1点だけ。${c}向けに使えそうな進め方を短くまとめられます。関心があればお送りします。`}</script></body></html>
