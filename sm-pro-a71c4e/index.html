<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SignalMailer AI</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0d0f12;color:#eef2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}.wrap{max-width:1180px;margin:auto;padding:24px 16px 70px}h1{font-size:32px;margin:6px 0}.muted{color:#98a2b0}.panel{background:#15181d;border:1px solid #272d36;border-radius:16px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;color:#9aa4b2}.field input,.field textarea,.field select{width:100%;border:1px solid #333b47;border-radius:9px;background:#0f1115;color:#f5f7fa;padding:11px;font:inherit}.field textarea{min-height:92px;resize:vertical}.drop{display:block;border:2px dashed #394250;border-radius:14px;padding:28px;text-align:center;cursor:pointer}.drop input{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:12px 17px;background:#fff;color:#0d0f12;font-weight:900;cursor:pointer}.btn.secondary{background:#242a33;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.status{font-size:13px;color:#aab4c1;margin-top:10px;min-height:20px}.progress{height:7px;background:#222831;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#fff;transition:.2s}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:1100px}th,td{padding:10px;border-bottom:1px solid #252b34;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#15181d;color:#99a4b1}.score{font-size:18px;font-weight:900}.good{color:#7ee2a8}.mid{color:#f3cf73}.low{color:#ef8d8d}.badge{display:inline-block;border:1px solid #333b47;padding:4px 8px;border-radius:999px;font-size:11px;color:#aeb8c5}.note{font-size:12px;color:#7f8997;line-height:1.7}.warn{color:#f1c36d}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><span class="badge">PRO</span><h1>SignalMailer AI</h1><div class="muted">営業リストを優先順位づけし、企業ごとの初回文と追客文をまとめて作る。</div>
<section class="panel"><div class="grid"><div class="field"><label>あなたの商品・サービス</label><textarea id="offer" placeholder="例：採用業務の工数を減らすSaaS。求人作成、候補者管理、面接調整を自動化。月額3万円〜。"></textarea></div><div class="field"><label>狙う相手 / 理想顧客</label><textarea id="icp" placeholder="例：従業員30〜300名、採用担当1〜5名、直近で採用強化中の企業。"></textarea></div></div><div class="grid" style="margin-top:12px"><div class="field"><label>CTA</label><input id="cta" value="15分だけ情報交換しませんか？"></div><div class="field"><label>文体</label><select id="tone"><option value="短く自然。売り込み臭を抑える">短く自然</option><option value="丁寧で法人向け。簡潔">丁寧</option><option value="かなり端的。2〜4文">超短文</option></select></div></div></section>
<section class="panel"><div class="grid"><div><label class="drop"><input id="file" type="file" accept=".csv,text/csv"><b>営業リストCSVを選択</b><br><span class="muted">推奨列：company, name, role, industry, signal, note, email, url</span></label><div class="row"><button class="btn secondary" id="sample">サンプルCSV</button></div></div><div><div class="field"><label>生成モード</label><select id="mode"><option value="gemini">Gemini API</option><option value="openai">OpenAI API</option><option value="template">APIなしテンプレ</option></select></div><div class="field" style="margin-top:10px"><label>APIキー（ブラウザ内のみ）</label><input id="key" type="password" autocomplete="off" placeholder="AIモード時のみ必要"></div><div class="field" style="margin-top:10px"><label>モデル</label><input id="model" value="gemini-2.5-flash"></div></div></div><div class="note" style="margin-top:12px">APIキーとCSVはこのサイトのサーバーへ保存しません。AIモードでは選択したAI事業者へ、生成に必要な行データだけ送信されます。</div></section>
<section class="panel"><div class="row"><button class="btn" id="run" disabled>優先順位＋営業文面を生成</button><button class="btn secondary" id="export" disabled>結果CSVを保存</button><button class="btn secondary" id="reset">リセット</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status"></div></section>
<section class="panel" id="out" hidden><div class="table"><table><thead><tr><th>優先度</th><th>会社</th><th>担当</th><th>理由</th><th>件名</th><th>初回</th><th>追客1</th><th>追客2</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id);let rows=[],results=[];
const aliases={company:['company','会社名','企業名','法人名'],name:['name','氏名','担当者','担当者名'],role:['role','役職','肩書'],industry:['industry','業種','業界'],signal:['signal','シグナル','最近の動き','トリガー','trigger'],note:['note','memo','メモ','備考','課題'],email:['email','メール','メールアドレス'],url:['url','website','サイト','web']};
function pick(r,key){for(const k of aliases[key]){if(r[k]!=null&&String(r[k]).trim())return String(r[k]).trim()}return ''}
function cleanObj(r){let o={};Object.keys(aliases).forEach(k=>o[k]=pick(r,k));return o}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function localScore(r){let s=35,why=[];if(r.signal){s+=25;why.push('具体的な動きあり')}if(/代表|社長|CEO|役員|部長|責任者|director|head|owner/i.test(r.role)){s+=18;why.push('決裁に近い')}if(r.note){s+=12;why.push('課題メモあり')}if(r.email){s+=5}if(r.url){s+=5}return {score:Math.min(100,s),reason:why.join(' / ')||'情報量が少ない'}}
function template(r){const ls=localScore(r),company=r.company||'貴社',person=r.name?`${r.name}様`:'ご担当者様',hook=r.signal||r.note||r.industry||'事業内容';const offer=$('offer').value.trim()||'業務効率化サービス',cta=$('cta').value.trim()||'少しお話しできませんか？';return {score:ls.score,reason:ls.reason,subject:`${company}の${hook.slice(0,18)}について`,first:`${person}\n突然のご連絡失礼します。${hook}を拝見し、${offer}がお役に立てる可能性があると思いご連絡しました。${cta}`,follow1:`先日の件、もし${hook}まわりが今期の優先事項でしたら、要点だけ共有できます。ご不要でしたら返信不要です。`,follow2:`最後に1点だけ。${company}向けに使えそうな進め方を短くまとめられます。関心があればお送りします。`}}
function promptFor(r){return `あなたはB2B新規営業の担当者。迷惑メールっぽい大げさな表現は禁止。以下の見込み客に対し、自然で短い日本語の営業文を作る。事実として与えられていない情報を捏造しない。\n\n自社商材: ${$('offer').value}\n理想顧客: ${$('icp').value}\nCTA: ${$('cta').value}\n文体: ${$('tone').value}\n見込み客: ${JSON.stringify(r)}\n\n0-100の優先度スコアと、その理由、件名、初回メール、3〜5日後の追客1、さらに5〜7日後の追客2を返す。各文は短く。JSONだけ返す。キーは score, reason, subject, first, follow1, follow2。`}
function parseJSON(t){t=String(t||'').trim().replace(/^```json\s*/i,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);return JSON.parse(t)}
async function callGemini(r){const key=$('key').value.trim(),model=$('model').value.trim()||'gemini-2.5-flash';const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:promptFor(r)}]}],generationConfig:{temperature:.45,responseMimeType:'application/json'}})});if(!res.ok)throw new Error('Gemini '+res.status);const j=await res.json();return parseJSON(j.candidates?.[0]?.content?.parts?.map(x=>x.text||'').join('')||'')}
async function callOpenAI(r){const key=$('key').value.trim(),model=$('model').value.trim()||'gpt-5-mini';const res=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model,input:promptFor(r),text:{format:{type:'json_object'}}})});if(!res.ok)throw new Error('OpenAI '+res.status);const j=await res.json();let t=j.output_text||'';if(!t&&Array.isArray(j.output))t=j.output.flatMap(x=>x.content||[]).map(x=>x.text||'').join('');return parseJSON(t)}
function render(){results.sort((a,b)=>(b.score||0)-(a.score||0));$('tbody').innerHTML=results.map(x=>{const c=x.score>=75?'good':x.score>=55?'mid':'low';return `<tr><td><span class="score ${c}">${esc(x.score)}</span></td><td><b>${esc(x.company)}</b><br><span class="muted">${esc(x.industry)}</span></td><td>${esc(x.name)}<br><span class="muted">${esc(x.role)}</span></td><td>${esc(x.reason)}</td><td>${esc(x.subject)}</td><td>${esc(x.first)}</td><td>${esc(x.follow1)}</td><td>${esc(x.follow2)}</td></tr>`}).join('');$('out').hidden=false;$('export').disabled=!results.length}
$('file').addEventListener('change',()=>{const f=$('file').files[0];if(!f)return;Papa.parse(f,{header:true,skipEmptyLines:true,complete:r=>{rows=r.data.map(cleanObj).filter(x=>x.company||x.name||x.email).slice(0,50);$('run').disabled=!rows.length;$('status').textContent=`${rows.length}件を読み込みました（最大50件）`;}})});
$('mode').addEventListener('change',()=>{$('model').value=$('mode').value==='openai'?'gpt-5-mini':$('mode').value==='gemini'?'gemini-2.5-flash':''});
$('run').onclick=async()=>{if(!rows.length)return;const mode=$('mode').value;if(mode!=='template'&&!$('key').value.trim()){ $('status').innerHTML='<span class="warn">APIキーを入力してください。</span>';return }$('run').disabled=true;results=[];$('out').hidden=true;for(let i=0;i<rows.length;i++){const r=rows[i];$('status').textContent=`${i+1}/${rows.length} ${r.company||r.name} を処理中…`;$('bar').style.width=`${Math.round(i/rows.length*100)}%`;let g;try{g=mode==='template'?template(r):mode==='gemini'?await callGemini(r):await callOpenAI(r)}catch(e){g=template(r);g.reason=`AI生成に失敗したためテンプレ生成 / ${g.reason}`;}results.push({...r,...g});render()}$('bar').style.width='100%';$('status').textContent=`完了：${results.length}件。優先度順に並べました。`;$('run').disabled=false};
$('export').onclick=()=>{const data=results.map(x=>({priority_score:x.score,company:x.company,name:x.name,role:x.role,industry:x.industry,signal:x.signal,note:x.note,email:x.email,url:x.url,reason:x.reason,subject:x.subject,first_message:x.first,followup_1:x.follow1,followup_2:x.follow2}));const csv=Papa.unparse(data);const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='signalmailer_results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('reset').onclick=()=>{rows=[];results=[];$('file').value='';$('tbody').innerHTML='';$('out').hidden=true;$('export').disabled=true;$('run').disabled=true;$('bar').style.width='0';$('status').textContent=''};
$('sample').onclick=()=>{const csv='company,name,role,industry,signal,note,email,url\n株式会社サンプル,田中,営業部長,SaaS,営業職を10名採用中,新規開拓を強化中,tanaka@example.com,https://example.com\n合同会社デモ,佐藤,代表,制作会社,新サービスを公開,営業は代表が兼任,sato@example.com,https://example.org';const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='signalmailer_sample.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
