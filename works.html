---
layout: page
title: 作品・書店
---
  <h1>{{ site.data.works.title }}</h1>
  <h2>主要作品</h2>
  <table>
    <tr><th>写真</th><th>詳細</th><th>取扱書店</th></tr>
    {% for item in site.data.works.items %}
    <tr>
      <td align="center" class="bg-light-green"><img src="{{ item.image }}" alt="{{ item.title }}" width="90" border="1" style="background:#eee;"></td>
      <td class="bg-light-green"><b>{{ item.title }}</b><br>{{ item.description | newline_to_br }}</td>
      <td class="bg-light-green">{{ item.stores | newline_to_br }}</td>
    </tr>
    {% endfor %}
  </table>
