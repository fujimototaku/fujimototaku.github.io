<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Insta</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111;background:#fff}
*{box-sizing:border-box}body{margin:0;background:#fff;color:#111}button,input,textarea{font:inherit}.app{max-width:540px;margin:0 auto;min-height:100dvh;padding-bottom:82px}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);z-index:20}.brand{font-family:Georgia,serif;font-style:italic;font-size:28px;font-weight:700;letter-spacing:-.04em}.iconbtn{border:0;background:none;padding:8px;font-size:24px;line-height:1;cursor:pointer}.stories{display:flex;gap:14px;overflow-x:auto;padding:14px 14px 12px;border-bottom:1px solid #eee;scrollbar-width:none}.stories::-webkit-scrollbar{display:none}.story{flex:0 0 68px;text-align:center;font-size:12px;color:#555}.ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#ff7a00,#e1306c,#833ab4);margin:auto auto 6px}.avatar{width:100%;height:100%;border-radius:50%;background:#eee;border:2px solid white;display:grid;place-items:center;font-weight:800;font-size:20px;overflow:hidden}.feed{min-height:55vh}.empty{padding:72px 28px;text-align:center;color:#777}.empty b{display:block;color:#111;font-size:22px;margin-bottom:8px}.post{border-bottom:1px solid #eee}.posthead{display:flex;align-items:center;gap:10px;padding:12px 14px}.smallava{width:34px;height:34px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:800}.name{font-size:14px;font-weight:700}.time{font-size:12px;color:#999}.photo{width:100%;aspect-ratio:1/1;background:#f2f2f2;object-fit:cover;display:block}.actions{display:flex;align-items:center;gap:14px;padding:10px 14px 2px}.action{border:0;background:none;padding:3px;font-size:25px;cursor:pointer}.likes{padding:4px 14px 2px;font-weight:700;font-size:14px}.caption{padding:2px 14px 14px;font-size:14px;line-height:1.5}.caption b{margin-right:6px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,540px);height:66px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #e9e9e9;background:rgba(255,255,255,.97);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(3,1fr);z-index:30}.nav{border:0;background:none;font-size:25px}.nav.active{font-weight:800}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:60}.sheet.open{display:flex}.panel{width:min(100%,540px);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}.grab{width:44px;height:5px;border-radius:99px;background:#ddd;margin:0 auto 18px}.panel h2{font-size:22px;margin:0 0 16px}.pick{display:block;border:1px dashed #bbb;border-radius:18px;min-height:220px;background:#f7f7f7;overflow:hidden;cursor:pointer;position:relative}.pick img{width:100%;height:100%;aspect-ratio:1/1;object-fit:cover;display:none}.pick .hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#666;padding:20px}.pick input{display:none}textarea{width:100%;border:0;border-bottom:1px solid #ddd;resize:none;min-height:80px;padding:14px 2px;outline:none;font-size:16px}.primary{width:100%;border:0;background:#111;color:white;border-radius:14px;padding:15px;font-weight:700;margin-top:16px}.secondary{width:100%;border:0;background:#f1f1f1;color:#111;border-radius:14px;padding:15px;font-weight:700;margin-top:8px}.profile{display:none;padding:22px 16px}.profile.show{display:block}.profileTop{display:flex;align-items:center;gap:18px;margin-bottom:22px}.bigava{width:76px;height:76px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);flex:1;text-align:center;font-size:13px}.stats b{display:block;font-size:18px}.bio{font-size:14px;line-height:1.5;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Insta</div><button class="iconbtn" id="topAdd" aria-label="投稿を追加">＋</button></header>
<section class="stories" aria-label="ストーリー">
<div class="story"><div class="ring"><div class="avatar">ME</div></div>あなた</div>
<div class="story"><div class="ring"><div class="avatar">空</div></div>そら</div>
<div class="story"><div class="ring"><div class="avatar">旅</div></div>たび</div>
<div class="story"><div class="ring"><div class="avatar">猫</div></div>ねこ</div>
<div class="story"><div class="ring"><div class="avatar">夜</div></div>よる</div>
</section>
<main id="home"><div id="feed" class="feed"></div></main>
<section id="profile" class="profile">
<div class="profileTop"><div class="bigava">ME</div><div class="stats"><div><b id="postCount">0</b>投稿</div><div><b>0</b>フォロワー</div><div><b>0</b>フォロー</div></div></div>
<div class="bio"><b>あなた</b><br>この端末だけの、小さな写真フィード。</div>
<div id="grid" class="grid"></div>
</section>
</div>
<nav class="bottom"><button class="nav active" id="homeNav" aria-label="ホーム">⌂</button><button class="nav" id="addNav" aria-label="投稿">＋</button><button class="nav" id="profileNav" aria-label="プロフィール">◎</button></nav>
<div class="sheet" id="sheet"><div class="panel"><div class="grab"></div><h2>新しい投稿</h2><label class="pick"><input id="file" type="file" accept="image/*"><img id="preview"><div class="hint" id="hint">写真を選ぶ<br><small>タップして写真ライブラリを開く</small></div></label><textarea id="caption" maxlength="220" placeholder="ひとこと書く"></textarea><button class="primary" id="publish">投稿する</button><button class="secondary" id="cancel">キャンセル</button></div></div>
<div class="toast" id="toast"></div>
<script>
const DB='instant-insta-v1', STORE='posts'; let db, selectedFile=null, objectUrls=[];
const $=s=>document.querySelector(s);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1500)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
function allPosts(){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.createdAt-a.createdAt));r.onerror=()=>rej(r.error)})}
function putPost(p){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).put(p);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function delPost(id){return new Promise((res,rej)=>{const r=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function dateText(ms){const d=new Date(ms),n=new Date(),diff=Math.floor((n-d)/60000);if(diff<1)return'今';if(diff<60)return diff+'分前';if(diff<1440)return Math.floor(diff/60)+'時間前';return `${d.getMonth()+1}/${d.getDate()}`}
function clearURLs(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
async function render(){clearURLs();const posts=await allPosts();$('#postCount').textContent=posts.length;const feed=$('#feed'),grid=$('#grid');grid.innerHTML='';if(!posts.length){feed.innerHTML='<div class="empty"><b>まだ投稿はありません。</b>＋ を押して、最初の一枚を置く。</div>';return}feed.innerHTML='';for(const p of posts){const u=URL.createObjectURL(p.blob);objectUrls.push(u);const article=document.createElement('article');article.className='post';article.innerHTML=`<div class="posthead"><div class="smallava">ME</div><div><div class="name">あなた</div><div class="time">${dateText(p.createdAt)}</div></div></div><img class="photo" src="${u}" alt="投稿写真"><div class="actions"><button class="action like" aria-label="いいね">${p.liked?'♥':'♡'}</button><button class="action share" aria-label="共有">↗</button><button class="action delete" aria-label="削除" style="margin-left:auto;font-size:20px">⋯</button></div><div class="likes">${p.liked?'1件のいいね':''}</div>${p.caption?`<div class="caption"><b>あなた</b>${esc(p.caption)}</div>`:'<div style="height:10px"></div>'}`;article.querySelector('.like').onclick=async()=>{p.liked=!p.liked;await putPost(p);render()};article.querySelector('.photo').ondblclick=async()=>{if(!p.liked){p.liked=true;await putPost(p);render()}};article.querySelector('.share').onclick=async()=>{try{const file=new File([p.blob],'photo.jpg',{type:p.blob.type||'image/jpeg'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],text:p.caption||''});else if(navigator.share)await navigator.share({text:p.caption||location.href,url:location.href});else throw 0}catch(e){if(e?.name!=='AbortError')toast('共有できませんでした')}};article.querySelector('.delete').onclick=async()=>{if(confirm('この投稿を削除しますか？')){await delPost(p.id);render()}};feed.appendChild(article);const gi=document.createElement('img');gi.src=u;gi.alt='投稿写真';grid.appendChild(gi)}}
function openSheet(){selectedFile=null;$('#file').value='';$('#caption').value='';$('#preview').style.display='none';$('#hint').style.display='grid';$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
$('#topAdd').onclick=openSheet;$('#addNav').onclick=openSheet;$('#cancel').onclick=closeSheet;$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#file').onchange=e=>{selectedFile=e.target.files?.[0]||null;if(!selectedFile)return;const u=URL.createObjectURL(selectedFile);$('#preview').src=u;$('#preview').style.display='block';$('#hint').style.display='none'};
$('#publish').onclick=async()=>{if(!selectedFile){toast('写真を選んでください');return}const p={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),blob:selectedFile,caption:$('#caption').value.trim(),createdAt:Date.now(),liked:false};await putPost(p);closeSheet();showHome();await render();toast('投稿しました')};
function showHome(){$('#home').style.display='block';$('#profile').classList.remove('show');$('#homeNav').classList.add('active');$('#profileNav').classList.remove('active')}
function showProfile(){$('#home').style.display='none';$('#profile').classList.add('show');$('#homeNav').classList.remove('active');$('#profileNav').classList.add('active')}
$('#homeNav').onclick=showHome;$('#profileNav').onclick=showProfile;
openDB().then(render).catch(()=>{$('#feed').innerHTML='<div class="empty"><b>保存領域を開けませんでした。</b>Safari/Chromeの通常タブで開いてください。</div>'});
</script>
</body>
</html>
