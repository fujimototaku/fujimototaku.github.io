---
layout: diary
title: 日記
---
<h1>{{ site.data.ui.navigation.items[3].label | remove: '■ ' }}</h1>
{% if site.posts.size > 0 %}
<ul class="post-list">
  {% for post in site.posts %}
  <li><span class="date">{{ post.date | date: "%Y/%m/%d" }}</span><a href="{{ post.url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>{{ site.data.ui.diary.empty_text }}</p>
{% endif %}
