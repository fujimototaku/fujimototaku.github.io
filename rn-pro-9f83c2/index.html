<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>領収書リネーマー Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px 80px}h1{font-size:32px;margin:12px 0 4px}.muted{color:#6b6b6b;font-size:14px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-top:22px}.drop{display:block;border:2px dashed #bbb;border-radius:14px;padding:38px 18px;text-align:center;cursor:pointer;background:#fafafa}.drop:hover{border-color:#555}.drop input{display:none}.btn{border:0;border-radius:10px;padding:12px 17px;font-weight:700;cursor:pointer;background:#111;color:#fff}.btn:disabled{opacity:.4;cursor:not-allowed}.ghost{background:#ecece8;color:#222}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.progress{margin-top:16px;height:8px;background:#ecece8;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#111;transition:.2s}.status{font-size:13px;color:#666;margin-top:8px;min-height:20px}.table-wrap{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{white-space:nowrap;color:#666}td input{width:100%;min-width:240px;border:1px solid #ccc;border-radius:7px;padding:8px}.pill{display:inline-block;background:#efefeb;border-radius:999px;padding:4px 9px;font-size:12px}.privacy{margin-top:12px;font-size:12px;color:#777}.error{color:#b00020}.ok{color:#176b2c}@media(max-width:650px){h1{font-size:26px}.panel{padding:14px}}
</style>
</head>
<body><main class="wrap">
<div class="pill">PRO</div><h1>領収書リネーマー</h1><div class="muted">領収書・請求書を読み取り、分かりやすいファイル名へまとめて変換します。</div>
<section class="panel">
<label class="drop" id="drop"><input id="files" type="file" multiple accept=".jpg,.jpeg,.png,.webp,.pdf"><b>ここを押してファイルを選択</b><br><span class="muted">JPG / PNG / WEBP / PDF</span></label>
<div class="row"><button class="btn" id="run" disabled>読み取って整理</button><button class="btn ghost" id="clear" disabled>クリア</button></div>
<div class="progress"><div class="bar" id="bar"></div></div><div class="status" id="status"></div>
<div class="privacy">処理はブラウザ内で行われます。選択した領収書ファイルをこのサイトのサーバーへ送信する処理はありません。</div>
</section>
<section class="panel" id="results" hidden>
<b>変換結果</b><div class="muted">ファイル名は保存前に直接編集できます。</div>
<div class="table-wrap"><table><thead><tr><th>元ファイル</th><th>新しいファイル名</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div class="row"><button class="btn" id="download">ZIPでまとめて保存</button></div>
</section>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const input=document.getElementById('files'),run=document.getElementById('run'),clear=document.getElementById('clear'),bar=document.getElementById('bar'),statusEl=document.getElementById('status'),results=document.getElementById('results'),tbody=document.getElementById('tbody'),download=document.getElementById('download');
let items=[];
input.addEventListener('change',()=>{run.disabled=!input.files.length;clear.disabled=!input.files.length;statusEl.textContent=input.files.length?`${input.files.length}件を選択しました`:''});
clear.onclick=()=>{input.value='';items=[];tbody.innerHTML='';results.hidden=true;run.disabled=true;clear.disabled=true;bar.style.width='0';statusEl.textContent=''};
function safe(s){return (s||'').replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,' ').trim().slice(0,40)}
function parseDate(text){
 const m=text.match(/(20\d{2})\s*[年\/\.\-]\s*(\d{1,2})\s*[月\/\.\-]\s*(\d{1,2})\s*日?/);
 if(!m)return '日付不明'; return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function parseAmount(text){
 const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean); const preferred=lines.filter(x=>/(合計|総額|TOTAL|お支払|支払額)/i.test(x)); const pool=[...preferred,...lines];
 let found=[]; for(const line of pool){for(const m of line.matchAll(/[¥￥]?\s*([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{2,7})\s*円?/g)){const n=parseInt(m[1].replace(/,/g,''),10);if(n>=50&&n<10000000)found.push(n)}}
 if(!found.length)return '金額不明'; return Math.max(...found)+'円';
}
function parseMerchant(text){
 const bad=/(領収書|レシート|請求書|納品書|receipt|invoice|合計|total|tel|電話|〒|http|www\.|20\d{2}|\d{2}:\d{2}|税込|税率|お釣|現金|クレジット)/i;
 const lines=text.split(/\n/).map(x=>safe(x)).filter(x=>x.length>=2&&x.length<=32&&!bad.test(x)&&!/^[-\d\s.,¥￥円]+$/.test(x));
 return lines[0]||'店名不明';
}
function extOf(name){const m=name.match(/\.([^.]+)$/);return m?m[1].toLowerCase():'bin'}
async function fileToOcrSource(file){
 if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
   const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise; const page=await pdf.getPage(1); const viewport=page.getViewport({scale:1.8}); const canvas=document.createElement('canvas'); canvas.width=viewport.width;canvas.height=viewport.height; await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise; return canvas;
 }
 return URL.createObjectURL(file);
}
async function ocr(file){
 const src=await fileToOcrSource(file); const r=await Tesseract.recognize(src,'jpn+eng',{logger:m=>{if(m.status==='recognizing text'&&m.progress){bar.style.width=Math.round(m.progress*100)+'%'}}}); if(typeof src==='string')URL.revokeObjectURL(src); return r.data.text||'';
}
run.onclick=async()=>{
 const files=[...input.files]; if(!files.length)return; run.disabled=true;clear.disabled=true;items=[];tbody.innerHTML='';results.hidden=true;
 for(let i=0;i<files.length;i++){
   const f=files[i]; statusEl.textContent=`${i+1}/${files.length} ${f.name} を読み取り中…`;bar.style.width='3%';
   try{const text=await ocr(f); const date=parseDate(text),merchant=parseMerchant(text),amount=parseAmount(text),ext=extOf(f.name); const name=safe(`${date}_${merchant}_${amount}`)+'.'+ext; items.push({file:f,name,text});}
   catch(e){items.push({file:f,name:safe(f.name),text:''});}
 }
 tbody.innerHTML='';items.forEach((it,i)=>{const tr=document.createElement('tr');const a=document.createElement('td');a.textContent=it.file.name;const b=document.createElement('td');const inp=document.createElement('input');inp.value=it.name;inp.oninput=()=>items[i].name=safe(inp.value.replace(/\.[^.]+$/,''))+'.'+extOf(it.file.name);b.appendChild(inp);tr.append(a,b);tbody.appendChild(tr)});
 results.hidden=false;bar.style.width='100%';statusEl.textContent='整理できました。必要ならファイル名を直して保存してください。';statusEl.className='status ok';run.disabled=false;clear.disabled=false;
};
download.onclick=async()=>{if(!items.length)return;download.disabled=true;download.textContent='ZIP作成中…';const zip=new JSZip();items.forEach(it=>zip.file(it.name,it.file));const blob=await zip.generateAsync({type:'blob'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='receipt-renamed.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);download.disabled=false;download.textContent='ZIPでまとめて保存'};
</script></body></html>
