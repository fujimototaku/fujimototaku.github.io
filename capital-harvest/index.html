<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資本刈り取りレーダー</title><style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#171717;--line:#ccc;--muted:#6b6b6b;--hi:#155d42}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1400px;margin:auto;padding:22px}h1{margin:0}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.toolbar button{padding:9px 10px;border:1px solid #aaa;border-radius:7px;background:#fff}button{cursor:pointer}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:white;border:1px solid var(--line);border-radius:9px;padding:10px 13px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.top{display:flex;justify-content:space-between;gap:10px}.reward{font-weight:800;font-size:20px;color:var(--hi);white-space:nowrap}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{font-size:11px;border:1px solid #bbb;border-radius:999px;padding:2px 6px;background:#fafafa}.actions{display:flex;gap:7px;margin-top:10px}.actions a,.actions button{font-size:12px;padding:7px 9px;border-radius:6px;border:1px solid #aaa;background:#fff;color:#111;text-decoration:none}.done{opacity:.38}.hidden{display:none!important}.danger{border-color:#b55}.lead{border-style:dashed}.src{font-size:11px;color:#666}.excerpt{font-size:12px;line-height:1.5;max-height:7.5em;overflow:auto;border-top:1px solid #eee;padding-top:7px;margin-top:7px}@media(max-width:600px){main{padding:12px}.cards{grid-template-columns:1fr}}
</style></head><body><main><h1>資本刈り取りレーダー</h1><p class="muted">全部拾う。金額で足切りしない。条件は実行前に一次情報で確認。</p><div class="stats" id="stats"></div><div class="toolbar"><input id="q" placeholder="検索"><select id="cat"><option value="">全ジャンル</option></select><select id="mode"><option value="active">現行</option><option value="free">0円/無料候補</option><option value="reentry">再入会/復帰</option><option value="targeted">対象者限定</option><option value="all">履歴すべて</option></select><select id="sort"><option value="smart">優先</option><option value="reward">金額</option><option value="new">新着</option><option value="deadline">期限</option></select><button onclick="resetState()">済み状態リセット</button><a href="data.csv" style="align-self:center">CSV</a></div><div id="cards" class="cards"></div></main><script>
let DATA=[]; const state=JSON.parse(localStorage.getItem('capitalHarvestState')||'{}');
const yen=v=>v==null?'—':Number(v).toLocaleString('ja-JP')+'円';
function save(){localStorage.setItem('capitalHarvestState',JSON.stringify(state))}
function mark(id,s){state[id]=s;save();render()}
function resetState(){if(confirm('済み/対象外のローカル状態を消しますか？')){localStorage.removeItem('capitalHarvestState');location.reload()}}
function smartScore(x){let s=(x.reward_yen_est||0); const t=x.tags||[]; if(t.includes('targeted'))s+=40000;if(t.includes('reentry'))s+=30000;if(t.includes('free_or_zero'))s+=20000;if(t.includes('guaranteed'))s+=10000;if(t.includes('lottery'))s-=5000;if(t.includes('borrowing_risk'))s-=50000;return s}
function render(){const q=document.getElementById('q').value.toLowerCase(),cat=document.getElementById('cat').value,mode=document.getElementById('mode').value,sort=document.getElementById('sort').value;let xs=DATA.filter(x=>{if(cat&&x.category!==cat)return false;if(q&&!((x.title+' '+x.excerpt+' '+x.source_name).toLowerCase().includes(q)))return false;if(mode==='active'&&x.status!=='active')return false;if(mode==='free'&&!(x.tags||[]).includes('free_or_zero'))return false;if(mode==='reentry'&&!(x.tags||[]).includes('reentry'))return false;if(mode==='targeted'&&!(x.tags||[]).includes('targeted'))return false;return true});xs.sort((a,b)=>sort==='reward'?(b.reward_yen_est||0)-(a.reward_yen_est||0):sort==='new'?String(b.discovered_at).localeCompare(String(a.discovered_at)):sort==='deadline'?String(a.deadline||'9999').localeCompare(String(b.deadline||'9999')):smartScore(b)-smartScore(a));document.getElementById('cards').innerHTML=xs.map(x=>{const st=state[x.id]||'';return `<article class="card ${st==='done'?'done':''} ${(x.tags||[]).includes('borrowing_risk')?'danger':''} ${x.evidence_level==='search-lead'?'lead':''}"><div class="top"><div><b>${esc(x.title)}</b><div class="src">${esc(x.source_name)} / ${esc(x.category)} ${x.deadline?' / 期限 '+esc(x.deadline):''}</div></div><div class="reward">${x.reward_text?esc(x.reward_text):yen(x.reward_yen_est)}</div></div><div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="excerpt">${esc(x.excerpt||'')}</div><div class="actions"><a href="${escAttr(x.url)}" target="_blank" rel="noopener">刈り取り先</a><button onclick="mark('${x.id}','done')">済み</button><button onclick="mark('${x.id}','skip')">対象外</button>${st?`<button onclick="mark('${x.id}','')">戻す</button>`:''}</div></article>`}).join('')||'<p>該当なし</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return esc(s)}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d.items||[];const cats=[...new Set(DATA.map(x=>x.category))].sort();document.getElementById('cat').innerHTML='<option value="">全ジャンル</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');document.getElementById('stats').innerHTML=`<div class="stat"><b>${d.meta?.active_count||0}</b><div class="muted">現行候補</div></div><div class="stat"><b>${d.meta?.source_success_count||0}/${d.meta?.source_count||0}</b><div class="muted">直接ソース取得</div></div><div class="stat"><b>${esc(d.meta?.generated_at||'')}</b><div class="muted">最終更新</div></div>`;render()}).catch(e=>document.getElementById('cards').innerHTML='<p>data.json未生成</p>');['q','cat','mode','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));
</script></body></html>
