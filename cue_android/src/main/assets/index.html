<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe6"><title>Cue</title><style>
:root{--bg:#f3efe6;--paper:#fffdf8;--ink:#181714;--muted:#777268;--line:#d8d0c3;--accent:#7a302c;--green:#315b46}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,textarea{font:inherit}.app{max-width:680px;margin:auto;padding:18px 15px 42px}.hidden{display:none!important}.top{height:52px;display:flex;align-items:center;justify-content:space-between}.logo{font:500 34px Georgia,serif}.plain{border:0;background:transparent;font-weight:800;padding:10px}.hero{min-height:62vh;display:grid;place-items:center;text-align:center}.hero h1,.role h1,.finish h1{font:500 38px/1.15 Georgia,serif;margin:0 0 12px}.sub{color:var(--muted);line-height:1.6;margin:0 0 26px}.btn{width:100%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:16px;padding:15px 16px;font-weight:850;margin:6px 0;box-shadow:0 10px 28px rgba(50,40,30,.05)}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn:disabled{opacity:.35}.methods{max-width:520px;margin:6vh auto 0}.methods h2{font:500 30px Georgia,serif}.privacy{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}.area{width:100%;min-height:54vh;border:1.5px solid var(--line);border-radius:18px;background:var(--paper);padding:15px;line-height:1.65;outline:none}.hint{font-size:12px;color:var(--muted);line-height:1.5}.error{color:#9d4339;font-size:13px}.role{padding-top:5vh}.roleList{display:grid;gap:9px;margin:20px 0}.roleBtn{width:100%;display:flex;justify-content:space-between;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:15px;text-align:left;font-weight:850}.roleBtn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.roleBtn small{color:var(--muted)}.homeCard{margin-top:9vh;background:var(--paper);border:1.5px solid var(--line);border-radius:23 der-color:var(--green);color:#fff}.finish{padding-top:22vh;text-align:center}.finishMark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 17px;background:var(--green);color:white;font-size:26px}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#171714;color:white;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}dialog{border:0;background:transparent;width:min(92vw,480px)}dialog::backdrop{background:#0005}.dialog{background:var(--paper);border-radius:20px;padding:16px}.dialog button{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px;text-align:left;font-weight:800}.danger{color:#9d4339}@media(max-width:430px){.modes{gap:6px}.mode{padding:12px 7px}.cue{font-size:20px}.answer{font-size:21px}}
</style></head><body><main class="app">
<section id="importV"><div class="top"><div class="logo">Cue</div><button id="importClose" class="plain hidden">閉じる</button></div><div id="landing" class="hero"><div><h1>台本を追加</h1><p class="sub">自分の台詞を、相手の台詞から思い出す。</p><button id="openMethods" class="btn primary">台本を追加</button></div></div><div id="methods" class="methods hidden"><button id="methodsBack" class="plain">← 戻る</button><h2>台本を入れる</h2><label class="btn" for="scriptFile">PDFから読み込む</label><input id="scriptFile" type="file" accept="application/pdf,.pdf,text/plain,.txt" hidden><button id="pasteOpen" class="btn">台本を貼り付ける</button><button id="sampleOpen" class="btn">サンプルで試す</button><p class="privacy">台本と稽古記録はこの端末内に保存されます。</p><p id="fileErr" class="error hidden"></p></div><div id="paste" class="methods hidden"><button id="pasteBack" class="plain">← 戻る</button><h2>台本を貼り付ける</h2><p class="hint">「役名：台詞」の形なら確実に読み取れます。</p><textarea id="scriptText" class="area" placeholder="アキラ：まだ帰らないの？&#10;ミナ：もう少しだけ。"></textarea><p id="pasteErr" class="error hidden"></p><button id="parseBtn" class="btn primary">役を選ぶ</button></div><div id="loading" class="methods hidden"><h2 id="loadingTitle">台本を読んでいます</h2><p id="loadingText" class="sub"></p></div></section>
<section id="roleV" class="hidden"><div class="top"><button id="roleBack" class="plain">← 戻る</button><div>役を選ぶ</div><span></span></div><div class="role"><h1>自分の役は？</h1><p id="parseSummary" class="sub"></p><div id="roleList" class="roleList"></div><button id="roleGo" class="btn primary" disabled>この役で始める</button></div></section>
<section id="homeV" class="hidden"><div class="top"><div class="logo">Cue</div><button id="menu" class="plain">•••</button></div><div class="homeCard"><div id="homeKick" class="eyebrow">つづき</div><h1 id="homeTitle">続きから稽古</h1><p id="homeDesc" class="sub"></p><button id="mainStart" class="btn primary">始める</button><div id="projectMeta" class="meta"></div></div><div class="modes"><button class="mode" data-mode="through">最初から<small>通して稽古</small></button><button id="weakBtn" class="mode" data-mode="weak">苦手だけ<small id="weakDesc">まだ記録なし</small></button><button class="mode" data-mode="random">ランダム<small>途中から突然</small></button></div><div id="stats" class="stats"></div></section>
<section id="practiceV" class="hidden"><div class="practiceHead"><button id="exit" class="plain">終了</button><div><b id="modeName"></b><br><span id="count" class="meta"></span></div><button id="speak" class="speak">▶</button></div><div class="progress"><i id="prog"></i></div><div class="practice"><div id="scene" class="scene"></div><div class="card"><div class="label">相手の台詞</div><div id="cueSpeaker" class="speaker"></div><div id="cueText" class="cue"></div><div id="stage" class="stage hidden"></div></div><div id="recallCard" class="card"><div id="recall" class="recall">自分の台詞を言ってみる</div><div id="hintText" class="recall hintText hidden"></div><div class="actions"><button id="hintBtn" class="btn">ヒント</button><button id="reveal" class="btn primary">答えを見る</button></div></div><div id="answerCard" class="card hidden"><div class="label">自分の台詞</div><div id="answer" class="answer"></div><div class="judge"><button id="fail" class="btn fail">言えなかった</button><button id="pass" class="btn pass">言えた</button></div></div></div></section>
<section id="finishV" class="hidden finish"><div class="finishMark">✓</div><h1>おつかれさま</h1><p id="summary" class="sub"></p><button id="againWeak" class="btn hidden">苦手をもう一度</button><button id="homeBtn" class="btn primary">ホームへ</button></section>
</main><dialog id="dlg"><div class="dialog"><h3 id="dlgTitle">台本</h3><button id="changeRole">役を変更</button><button id="replace">台本を入れ替える</button><button id="reset">稽古記録をリセット</button><button id="delete" class="danger">台本を削除</button><button id="closeDlg">閉じる</button></div></dialog><div id="toast" class="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(()=>{'use strict';const KEY='cue-android-v1',OLD='cue-theatre-v5',$=id=>document.getElementById(id),now=()=>Date.now();let project=null,draft=null,selected='',sourceName='',sourceText='',session=null;try{project=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD)||'null')}catch(e){}
function show(id){['importV','roleV','homeV','practiceV','finishV'].forEach(v=>$(v).classList.toggle('hidden',v!==id));scrollTo(0,0)}function toast(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1300)}function save(){if(project)localStorage.setItem(KEY,JSON.stringify(project))}function clean(s){return String(s||'').replace(/\r/g,'').replace(/\u3000/g,' ').trim()}function sid(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return 'u'+(h>>>0).toString(36)}function parse(text){const lines=clean(text).split('\n'),turns=[],counts=new Map();let scene='',n=0;const push=(role,txt)=>{role=clean(role).replace(/[：:]$/,'');txt=clean(txt).replace(/^[「『“"]|[」』”"]$/g,'');if(!role||!txt)return;counts.set(role,(counts.get(role)||0)+1);turns.push({id:++n,type:'d',role,text:txt,scene})};for(let i=0;i<lines.length;i++){let s=clean(lines[i]);if(!s)continue;if(/^【.+】$/.test(s)||/^第.+[場幕景]$/.test(s)){scene=s.replace(/[【】]/g,'');turns.push({id:++n,type:'scene',text:scene,scene});continue}if(/^[(（［\[].+[)）］\]]$/.test(s)){turns.push({id:++n,type:'stage',text:s,scene});continue}let m=s.match(/^([^：:]{1,30})[：:]\s*(.+)$/);if(m){push(m[1],m[2]);continue}let next=clean(lines[i+1]||'');if(s.length<=20&&next&&/^[「『“"]/.test(next)){push(s,next);i++;continue}turns.push({id:++n,type:'stage',text:s,scene})}return{raw:text,turns,roles:[...counts].sort((a,b)=>b[1]-a[1]).map(([role,count])=>({role,count})),dialogueCount:turns.filter(t=>t.type==='d').length}}
function units(p=project){if(!p)return[];const out=[];let occ=0;for(let i=0;i<p.turns.length;i++){const t=p.turns[i];if(t.type!=='d'||t.role!==p.role)continue;let cue=null,stage=[];for(let j=i-1;j>=0;j--){const q=p.turns[j];if(q.type==='scene')break;if(q.type==='stage'){stage.unshift(q.text);continue}if(q.type==='d'&&q.role!==p.role){cue={role:q.role,text:q.text};break}}occ++;const c=cue||{role:'',text:'ここから始める'};out.push({key:sid([p.role,t.scene,c.role,c.text,t.text,occ].join('\0')),index:i,scene:t.scene||'',cue:c,stage,target:t.text})}return out}function def(){return{strength:0,clean:0,hint:0,fail:0,last:0,next:0}}function stat(k){project.stats[k]??=def();return project.stats[k]}function weak(all=units()){return all.filter(u=>{const s=stat(u.key);return s.fail>0||s.hint>0}).sort((a,b)=>(stat(b.key).fail*5+stat(b.key).hint*2-stat(b.key).strength)-(stat(a.key).fail*5+stat(a.key).hint*2-stat(a.key).strength))}function due(all=units()){const t=now();return all.filter(u=>{const s=stat(u.key);return !s.last||s.next<=t}).sort((a,b)=>(stat(a.key).next||0)-(stat(b.key).next||0))}function gradeStat(k,g){const s={...def(),...stat(k)},t=now();s.last=t;if(g==='ok'){s.clean++;s.strength=Math.min(6,s.strength+1);s.next=t+[1,3,7,14,30,60][Math.max(0,s.strength-1)]*864e5}else if(g==='hint'){s.hint++;s.next=t+(s.strength>=2?864e5:6*36e5)}else{s.fail++;s.strength=Math.max(0,s.strength-1);s.next=t+10*6e4}project.stats[k]=s}
function openImport(first=false){$('importClose').classList.toggle('hidden',first||!project);$('landing').classList.remove('hidden');$('methods').classList.add('hidden');$('paste').classList.add('hidden');$('loading').classList.add('hidden');show('importV')}function prep(text,name){draft=parse(text);sourceText=clean(text);sourceName=name||'台本';selected='';if(!draft.roles.length){$('paste').classList.remove('hidden');$('landing').classList.add('hidden');$('methods').classList.add('hidden');$('scriptText').value=sourceText;$('pasteErr').textContent='役名を読み取れませんでした。「役名：台詞」の形にしてください。';$('pasteErr').classList.remove('hidden');return}renderRoles();show('roleV')}function renderRoles(){$('parseSummary').textContent=`${draft.roles.length}役・${draft.dialogueCount}台詞を読み取りました`;$('roleList').innerHTML='';draft.roles.forEach(r=>{const b=document.createElement('button');b.className='roleBtn';b.innerHTML='<span></span><small></small>';b.querySelector('span').textContent=r.role;b.querySelector('small').textContent=r.count+'本';b.onclick=()=>{selected=r.role;[...$('roleList').children].forEach(x=>x.classList.toggle('sel',x===b));$('roleGo').disabled=false};$('roleList').appendChild(b)});$('roleGo').disabled=true}
async function fileLoad(f){if(!f)return;sourceName=(f.name||'台本').replace(/\.[^.]+$/,'');$('landing').classList.add('hidden');$('methods').classList.add('hidden');$('loading').classList.remove('hidden');$('loadingText').textContent=f.name||'';try{let text='';if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){if(!window.pdfjsLib)throw Error('PDF');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,parts=[];for(let p=1;p<=pdf.numPages;p++){$('loadingText').textContent=`${p} / ${pdf.numPages} ページ`;const page=await pdf.getPage(p),c=await page.getTextContent();parts.push(c.items.map(x=>x.str).join(' '))}text=parts.join('\n')}else text=await f.text();if(!clean(text))throw Error('EMPTY');prep(text,sourceName)}catch(e){$('loading').classList.add('hidden');$('methods').classList.remove('hidden');$('fileErr').textContent=e.message==='PDF'?'PDF読み込み機能を取得できません。通信を確認してください。':'読み取れませんでした。台本を貼り付けて試してください。';$('fileErr').classList.remove('hidden')}}function commit(){if(!draft||!selected)return;const old=project,oldStats=old?.stats||{},sig=new Map((old?units(old):[]).map(u=>[[u.cue.role,u.cue.text,u.target].join('\0'),oldStats[u.key]]));project={version:1,title:sourceName,raw:sourceText,role:selected,turns:draft.turns,stats:{},resume:old?.resume||0};for(const u of units(project)){const s=sig.get([u.cue.role,u.cue.text,u.target].join('\0'));if(s)project.stats[u.key]=s}save();renderHome();show('homeV')}
function renderHome(){if(!project)return openImport(true);const all=units(),d=due(all),w=weak(all);$('projectMeta').textContent=`${project.role} ・ ${project.title}`;if(d.length){$('homeKick').textContent='復習';$('homeTitle').textContent=`復習 ${Math.min(d.length,10)}本`;$('homeDesc').textContent='今思い出すと、残りやすい台詞です。';$('mainStart').dataset.mode='review';$('mainStart').textContent='復習する'}else{$('homeKick').textContent='つづき';$('homeTitle').textContent='続きから稽古';$('homeDesc').textContent=all.length?`${Math.min((project.resume||0)+1,all.length)} / ${all.length} から`:'自分の台詞がありません';$('mainStart').dataset.mode='continue';$('mainStart').textContent='始める'}$('mainStart').disabled=!all.length;$('weakBtn').disabled=!w.length;$('weakDesc').textContent=w.length?`${w.length}本を優先`:'まだ苦手記録なし';$('stats').textContent=`自分の台詞 ${all.length}本 ・ 苦手 ${w.length}本 ・ 定着 ${all.filter(u=>stat(u.key).strength>=3).length}本`}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function queue(mode){const all=units();if(mode==='review'){const d=due(all);return(d.length?d:weak(all)).slice(0,10)}if(mode==='weak')return weak(all).slice(0,12);if(mode==='random')return shuffle(all).slice(0,12);if(mode==='through')return all;const s=Math.min(project.resume||0,Math.max(0,all.length-1));return[...all.slice(s),...all.slice(0,s)].slice(0,12)}function start(mode){const q=queue(mode);if(!q.length)return toast('稽古する台詞がありません');session={mode,q,pos:0,ok:0,hinted:0,fail:0,hintLevel:0,hintUsed:false,failed:new Set};show('practiceV');renderPractice()}function cur(){return session?.q[session.pos]}function modeLabel(m){return{review:'復習',weak:'苦手だけ',random:'ランダム',through:'最初から',continue:'つづき'}[m]||'稽古'}function renderPractice(){const u=cur();if(!u)return;$('modeName').textContent=modeLabel(session.mode);$('count').textContent=`${session.pos+1} / ${session.q.length}`;$('prog').style.width=Math.round(session.pos/session.q.length*100)+'%';$('scene').textContent=u.scene;$('cueSpeaker').textContent=u.cue.role;$('cueText').textContent=u.cue.text;$('stage').textContent=u.stage.join(' / ');$('stage').classList.toggle('hidden',!u.stage.length);$('recallCard').classList.remove('hidden');$('answerCard').classList.add('hidden');$('recall').classList.remove('hidden');$('hintText').classList.add('hidden');$('hintBtn').disabled=false;$('hintBtn').textContent='ヒント';session.hintLevel=0;session.hintUsed=false}function hint(){const u=cur();session.hintUsed=true;session.hintLevel=Math.min(2,session.hintLevel+1);const chars=[...u.target],n=session.hintLevel===1?Math.min(6,chars.length):Math.max(8,Math.ceil(chars.length*.35));$('recall').classList.add('hidden');$('hintText').classList.remove('hidden');$('hintText').textContent=chars.slice(0,n).join('')+(n<chars.length?'…':'');$('hintBtn').textContent=session.hintLevel===1?'もう少し':'ヒント済み';$('hintBtn').disabled=session.hintLevel>=2}function reveal(){$('answer').textContent=cur().target;$('recallCard').classList.add('hidden');$('answerCard').classList.remove('hidden')}function judge(ok){const u=cur(),g=ok?(session.hintUsed?'hint':'ok'):'fail';gradeStat(u.key,g);if(ok){session.hintUsed?session.hinted++:session.ok++}else{session.fail++;session.failed.add(u.key);const rest=session.q.slice(session.pos+1);if(!rest.some(x=>x.key===u.key))session.q.splice(Math.min(session.q.length,session.pos+3),0,u)}if(['continue','through'].includes(session.mode)){const all=units(),i=all.findIndex(x=>x.key===u.key);if(i>=0)project.resume=(i+1)%Math.max(1,all.length)}save();session.pos++;session.pos>=session.q.length?finish():renderPractice()}function finish(){$('summary').textContent=`言えた ${session.ok}本${session.hinted?` ・ ヒントあり ${session.hinted}本`:''}${session.fail?` ・ 言えなかった ${session.fail}回`:''}`;$('againWeak').classList.toggle('hidden',!session.failed.size);renderHome();show('finishV')}function speak(){const u=cur();if(!u||!('speechSynthesis'in window))return toast('この端末では読み上げできません');speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(u.cue.text);s.lang='ja-JP';s.rate=.94;speechSynthesis.speak(s)}
$('openMethods').onclick=()=>{$('landing').classList.add('hidden');$('methods').classList.remove('hidden')};$('methodsBack').onclick=()=>{$('methods').classList.add('hidden');$('landing').classList.remove('hidden')};$('scriptFile').onchange=e=>{fileLoad(e.target.files?.[0]);e.target.value=''};$('pasteOpen').onclick=()=>{$('methods').classList.add('hidden');$('paste').classList.remove('hidden');$('scriptText').value=project?.raw||''};$('pasteBack').onclick=()=>{$('paste').classList.add('hidden');$('methods').classList.remove('hidden')};$('parseBtn').onclick=()=>{const t=$('scriptText').value;if(!clean(t)){ $('pasteErr').textContent='台本を貼り付けてください。';$('pasteErr').classList.remove('hidden');return}prep(t,project?.title||'台本')};$('sampleOpen').onclick=()=>prep('【第一場】\nアキラ：まだ帰らないの？\nミナ：もう少しだけ。\nアキラ：明日も早いよ。\nミナ：分かってる。でも、今日はここにいたい。\n（少し間）\nアキラ：じゃあ、あと五分だけ。\nミナ：うん。五分だけ。','サンプル台本');$('importClose').onclick=()=>{renderHome();show('homeV')};$('roleBack').onclick=()=>openImport(false);$('roleGo').onclick=commit;$('mainStart').onclick=()=>start($('mainStart').dataset.mode||'continue');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('exit').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}renderHome();show('homeV')};$('hintBtn').onclick=hint;$('reveal').onclick=reveal;$('pass').onclick=()=>judge(true);$('fail').onclick=()=>judge(false);$('speak').onclick=speak;$('homeBtn').onclick=()=>{renderHome();show('homeV')};$('againWeak').onclick=()=>start('weak');$('menu').onclick=()=>{$('dlgTitle').textContent=project?.title||'台本';$('dlg').showModal()};$('closeDlg').onclick=()=>$('dlg').close();$('replace').onclick=()=>{$('dlg').close();openImport(false)};$('changeRole').onclick=()=>{$('dlg').close();sourceText=project.raw;sourceName=project.title;draft=parse(project.raw);selected='';renderRoles();show('roleV')};$('reset').onclick=()=>{if(!confirm('稽古記録をリセットしますか？'))return;project.stats={};project.resume=0;save();$('dlg').close();renderHome();toast('リセットしました')};$('delete').onclick=()=>{if(!confirm('台本と稽古記録を削除しますか？'))return;localStorage.removeItem(KEY);localStorage.removeItem(OLD);project=null;$('dlg').close();openImport(true)};if(project){project.stats=project.stats||{};project.resume=project.resume||0;renderHome();show('homeV')}else openImport(true)})();
