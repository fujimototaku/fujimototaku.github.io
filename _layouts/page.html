<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ site.data.site.description | strip_newlines }}">
  <meta name="theme-color" content="#e9e8df">
  <title>{{ page.title }} | {{ site.data.site.title }}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  {% include header.html %}
  <div class="page-shell">
    {% include navigation.html %}
    <main id="main" class="content">
      <section class="panel page-content">
        {{ content }}
      </section>
    </main>
  </div>
  {% include footer.html %}
</body>
</html>
