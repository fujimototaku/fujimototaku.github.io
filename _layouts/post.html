<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#000033">
  <title>{{ page.title }} | {{ site.data.site.title }}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  {% include header.html %}
  <div class="page-shell">
    {% include navigation.html %}
    <main id="main" class="content">
      <article class="panel page-content post-body">
        <h1 class="article-title">{{ page.title }}</h1>
        <div class="date">{{ page.date | date: "%Y年%m月%d日" }}</div>
        {{ content }}
        <p class="back-link">← <a href="/diary/">日記一覧へ戻る</a></p>
      </article>
    </main>
  </div>
  {% include footer.html %}
</body>
</html>
