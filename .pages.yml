media:
  - name: site_images
    label: サイト画像
    input: media/site
    output: /media/site
    categories: [image]
    rename: safe
  - name: diary_images
    label: 日記画像
    input: media/diary
    output: /media/diary
    categories: [image]
    rename: safe

content:
  - name: fixed_pages
    label: 固定ページ
    type: group
    items:
      - name: site
        label: サイト基本設定
        type: file
        path: _data/site.yml
        format: yaml
        fields:
          - name: title
            label: サイト名
            type: string
            required: true
          - name: description
            label: サイト説明
            type: text
            required: true
          - name: keywords
            label: 検索キーワード
            type: string
            list: true
          - name: external_links
            label: 外部リンク
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: 表示名
                type: string
                required: true
              - name: url
                label: URL
                type: string
                required: true
          - name: footer
            label: フッター
            type: string
            required: true

      - name: home
        label: トップページ内容
        type: file
        path: _data/home.yml
        format: yaml
        fields:
          - name: updated_at
            label: 最終更新日時
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: retro
            label: 最上部・ようこそ欄
            type: object
            required: true
            fields:
              - name: eyebrow
                label: 最上部の一言
                type: string
              - name: ticker
                label: 流れる文字
                type: text
              - name: welcome_title
                label: ようこそ欄の見出し
                type: string
              - name: welcome_body
                label: ようこそ欄の本文
                type: rich-text
                options:
                  format: markdown
                  switcher: true
          - name: profile
            label: プロフィール
            type: object
            required: true
            fields:
              - name: name
                label: 名前
                type: string
                required: true
              - name: image
                label: 写真
                type: image
                options:
                  media: site_images
              - name: likes
                label: 好き
                type: text
              - name: dislikes
                label: 嫌い
                type: text
          - name: announcements
            label: お知らせ
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {text}"
            fields:
              - name: date
                label: 日付
                type: date
                required: true
                options:
                  format: yyyy/MM/dd
              - name: text
                label: 内容
                type: string
                required: true
          - name: stores
            label: 取扱店
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{area}"
            fields:
              - name: area
                label: 地域
                type: string
                required: true
              - name: names
                label: 店名
                type: text
                required: true
          - name: shop
            label: 通販
            type: object
            fields:
              - name: label
                label: 表示名
                type: string
              - name: url
                label: URL
                type: string
          - name: event
            label: 次のイベント
            type: object
            fields:
              - name: label
                label: 見出し
                type: string
              - name: datetime
                label: 開催日時
                type: date
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: observatory
            label: 定点観測
            type: object
            fields:
              - name: enabled
                label: 表示する
                type: boolean
              - name: title
                label: 見出し
                type: string
              - name: url
                label: リンク先
                type: string
              - name: caption
                label: リンク表示名
                type: string

      - name: ui
        label: 全体の表示文言・メニュー
        type: file
        path: _data/ui.yml
        format: yaml
        fields:
          - name: header
            label: ヘッダー
            type: object
            fields:
              - name: skip_link
                label: 本文ジャンプ文言
                type: string
              - name: ticker_aria_label
                label: 流れる文字の説明
                type: string
          - name: navigation
            label: メニュー
            type: object
            fields:
              - name: menu_title
                label: メニュー見出し
                type: string
              - name: items
                label: メニュー項目
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: 表示名
                    type: string
                  - name: url
                    label: リンク先
                    type: string
              - name: external_title
                label: 外部リンク見出し
                type: string
              - name: external_prefix
                label: 外部リンク先頭記号
                type: string
          - name: home
            label: トップページの固定文言
            type: object
            fields:
              - name: profile_heading
                label: 管理人欄見出し
                type: string
              - name: likes_label
                label: 好きのラベル
                type: string
              - name: dislikes_label
                label: 嫌いのラベル
                type: string
              - name: announcements_heading
                label: お知らせ見出し
                type: string
              - name: stores_heading
                label: 取扱店見出し
                type: string
              - name: shop_area_label
                label: 通販ラベル
                type: string
              - name: store_note
                label: 在庫注意書き
                type: text
              - name: updated_label
                label: 最終更新ラベル
                type: string
              - name: alive_label
                label: 生存確認ラベル
                type: string
              - name: loading_text
                label: 読み込み中の文言
                type: string
              - name: unknown_text
                label: 不明時の文言
                type: string
              - name: event_finished_text
                label: イベント終了時の文言
                type: string
              - name: search_aria_label
                label: 検索欄の説明
                type: string
              - name: search_button
                label: 検索ボタン
                type: string
              - name: globe_title
                label: 地球儀の見出し
                type: string
              - name: globe_aria_label
                label: 地球儀の説明
                type: string
              - name: globe_note
                label: 地球儀の注意書き
                type: text
          - name: works
            label: 作品ページの固定文言
            type: object
            fields:
              - name: section_heading
                label: 作品一覧見出し
                type: string
              - name: image_header
                label: 写真列
                type: string
              - name: detail_header
                label: 詳細列
                type: string
              - name: stores_header
                label: 取扱書店列
                type: string
          - name: activity
            label: 活動ページ
            type: object
            fields:
              - name: detail_prefix
                label: 内容の先頭記号
                type: string
          - name: diary
            label: 日記ページ
            type: object
            fields:
              - name: page_title
                label: 日記一覧の見出し
                type: string
              - name: notice
                label: 日記上部の注意書き
                type: text
              - name: empty_text
                label: 記事がない時の文言
                type: string
              - name: back_label
                label: 一覧へ戻る文言
                type: string

      - name: works
        label: 作品・書店
        type: file
        path: _data/works.yml
        format: yaml
        fields:
          - name: title
            label: ページ見出し
            type: string
            required: true
          - name: items
            label: 作品
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: 作品名
                type: string
                required: true
              - name: image
                label: 写真
                type: image
                options:
                  media: site_images
              - name: description
                label: 説明
                type: text
              - name: stores
                label: 取扱書店
                type: text

      - name: activity
        label: 活動履歴
        type: file
        path: _data/activity.yml
        format: yaml
        fields:
          - name: title
            label: ページ見出し
            type: string
            required: true
          - name: items
            label: 活動
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: 題名
                type: string
                required: true
              - name: date
                label: 日付・著者・編集
                type: string
              - name: detail
                label: 内容
                type: text

      - name: contact
        label: お問い合わせ
        type: file
        path: _data/contact.yml
        format: yaml
        fields:
          - name: title
            label: ページ見出し
            type: string
            required: true
          - name: heading
            label: 小見出し
            type: string
          - name: intro
            label: 説明
            type: text
          - name: email
            label: 表示するメールアドレス
            type: string
            required: true
          - name: note
            label: 注意書き
            type: text

  - name: advanced_editing
    label: 高度な編集（HTML/CSS・壊せます）
    type: group
    items:
      - name: advanced_css
        label: style.css
        type: file
        path: style.css
        format: code
        operations:
          delete: false
      - name: advanced_index
        label: トップ index.html
        type: file
        path: index.html
        format: code
        operations:
          delete: false
      - name: advanced_header
        label: ヘッダー
        type: file
        path: _includes/header.html
        format: code
        operations:
          delete: false
      - name: advanced_navigation
        label: メニュー
        type: file
        path: _includes/navigation.html
        format: code
        operations:
          delete: false
      - name: advanced_footer
        label: フッター
        type: file
        path: _includes/footer.html
        format: code
        operations:
          delete: false
      - name: advanced_page_layout
        label: 通常ページレイアウト
        type: file
        path: _layouts/page.html
        format: code
        operations:
          delete: false
      - name: advanced_diary_layout
        label: 日記一覧レイアウト
        type: file
        path: _layouts/diary.html
        format: code
        operations:
          delete: false
      - name: advanced_post_layout
        label: 日記記事レイアウト
        type: file
        path: _layouts/post.html
        format: code
        operations:
          delete: false
      - name: advanced_works
        label: 作品ページHTML
        type: file
        path: works.html
        format: code
        operations:
          delete: false
      - name: advanced_info
        label: 活動ページHTML
        type: file
        path: info.html
        format: code
        operations:
          delete: false
      - name: advanced_contact
        label: 問い合わせページHTML
        type: file
        path: contact.html
        format: code
        operations:
          delete: false
      - name: advanced_diary_index
        label: 日記一覧HTML
        type: file
        path: diary/index.html
        format: code
        operations:
          delete: false

  - name: diary
    label: 日記
    type: collection
    path: _posts
    format: yaml-frontmatter
    exclude: ["README.md"]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: false
    view:
      primary: title
      sort: [title]
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: body
        label: 本文
        type: rich-text
        required: true
        options:
          format: markdown
          media: diary_images
          switcher: true

settings:
  content:
    merge: true
  commit:
    templates:
      create: "追加: {filename}"
      update: "更新: {filename}"
      delete: "削除: {filename}"
      rename: "改名: {oldPath} -> {newPath}"
