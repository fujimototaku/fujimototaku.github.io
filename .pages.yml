        type: string
        required: true
      - name: intro
        label: 説明
        type: text
      - name: empty_text
        label: 何もない時の文言
        type: string
      - name: launch_label
        label: 起動リンクの文言
        type: string
      - name: items
        label: アプリ
        type: object
        list:
          collapsible:
