media:
  - name: site_images
    label: サイト画像
    input: media/site
    output: /media/site
    categories: [image]
    rename: safe
  - name: diary_images
    label: 日記画像
    input: media/diary
    output: /media/diary
    categories: [image]
    rename: safe

content:
  - name: fixed_pages
    label: 固定ページ
    type: group
    items:
      - name: site
        label: サイト基本設定
        type: file
        path: _data/site.yml
        format: yaml
        fields:
          - name: title
            label: サイト名
            type: string
            required: true
          - name: description
            label: サイト説明
            type: text
            required: true
          - name: keywords
            label: 検索キーワード
            type: string
            list: true
          - name: external_links
            label: 外部リンク
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: 表示名
                type: string
                required: true
              - name: url
                label: URL
                type: string
                required: true
          - name: footer
            label: フッター
            type: string
            required: true

      - name: home
        label: トップページ内容
        type: file
        path: _data/home.yml
        format: yaml
        fields:
          - name: updated_at
            label: 最終更新日時
            type: date
            required: true
            options:
              time: true
              format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: retro
            label: ようこそ欄
            type: object
            required: true
            fields:
              - name: eyebrow
                label: 最上部の一言
                type: string
              - name: welcome_title
                label: ようこそ欄の見出し
                type: string
              - name: welcome_body
                label: ようこそ欄の本文
                type: rich-text
                options:
                  format: markdown
                  switcher: true
          - name: profile
            label: プロフィール
            type: object
            required: true
            fields:
              - name: name
                label: 名前
                type: string
                required: true
              - name: image
                label: 写真
                type: image
                options:
                  media: site_images
              - name: likes
                label: 好き
                type: text
              - name: dislikes
                label: 嫌い
                type: text
          - name: announcements
            label: お知らせ
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {text}"
            fields:
              - name: date
                label: 日付
                type: date
                required: true
                options:
                  format: yyyy/MM/dd
              - name: text
                label: 内容
                type: string
                required: true
          - name: stores
            label: 取扱店
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{area}"
            fields:
              - name: area
                label: 地域
                type: string
                required: true
              - name: names
                label: 店名
                type: text
                required: true
          - name: shop
            label: 通販
            type: object
            fields:
              - name: label
                label: 表示名
                type: string
              - name: url
                label: URL
                type: string
          - name: event
            label: 次のイベント
            type: object
            fields:
              - name: label
                label: 見出し
                type: string
              - name: datetime
                label: 開催日時
                type: date
                options:
                  time: true
                  format: "yyyy-MM-dd'T'HH:mm:ssXXX"
          - name: observatory
            label: 定点観測
            type: object
            fields:
              - name: enabled
                label: 表示する
                type: boolean
              - name: title
                label: 見出し
                type: string
              - name: url
                label: リンク先
                type: string
              - name: caption
                label: リンク表示名
                type: string

      - name: timeline
        label: タイムマシン記録
        type: file
        path: _data/timeline.yml
        format: yaml
        fields:
          - name: title
            label: ページ見出し
            type: string
            required: true
          - name: intro
            label: 説明
            type: text
          - name: entries
            label: 時系列記録
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{date} {title}"
            fields:
              - name: date
                label: 日付
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: type
                label: 種類
                type: string
                description: photo / movie / note / x / activity / book / place / other など
              - name: source
                label: 出典・サービス名
                type: string
              - name: title
                label: 題名
                type: string
                required: true
              - name: text
                label: 内容
                type: text
              - name: url
                label: リンク先
                type: string
              - name: image
                label: 画像
                type: image
                options:
                  media: site_images

      - name: ui
        label: 全体の表示文言・メニュー
        type: file
        path: _data/ui.yml
        format: yaml
        fields:
          - name: header
            label: ヘッダー
            type: object
            fields:
              - name: skip_link
                label: 本文ジャンプ文言
                type: string
          - name: navigation
            label: メニュー
            type: object
            fields:
              - name: menu_title
                label: メニュー見出し
                type: string
              - name: items
                label: メニュー項目
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}"
                fields:
                  - name: label
                    label: 表示名
                    type: string
                  - name: url
                    label: リンク先
                    type: string
              - name: external_title
                label: 外部リンク見出し
                type: string
              - name: external_prefix
                label: 外部リンク先頭記号
                type: string
              - name: item_prefix
                label: メニュー項目先頭記号
                type: string
          - name: home
            label: トップページの固定文言
            type: object
            fields:
              - name: profile_heading
                label: 管理人欄見出し
                type: string
              - name: section_prefix
                label: セクション見出し先頭記号
                type: string
              - name: section_suffix
                label: セクション見出し末尾記号
                type: string
              - name: profile_image_alt_suffix
                label: プロフィール写真の後ろに付ける文言
                type: string
              - name: likes_label
                label: 好きのラベル
                type: string
              - name: dislikes_label
                label: 嫌いのラベル
                type: string
              - name: announcements_heading
                label: お知らせ見出し
                type: string
              - name: announcements_aria_label
                label: お知らせ欄の読み上げ名
                type: string
              - name: stores_heading
                label: 取扱店見出し
                type: string
              - name: shop_area_label
                label: 通販ラベル
                type: string
              - name: store_note
                label: 在庫注意書き
                type: text
              - name: updated_label
                label: 最終更新ラベル
                type: string
              - name: updated_at_format
                label: 更新日時の表示形式
                type: string
              - name: alive_label
                label: 生存確認ラベル
                type: string
              - name: loading_text
                label: 読み込み中の文言
                type: string
              - name: unknown_text
                label: 不明時の文言
                type: string
              - name: event_finished_text
                label: イベント終了時の文言
                type: string
              - name: search_aria_label
                label: 検索欄の説明
                type: string
              - name: search_button
                label: 検索ボタン
                type: string
              - name: wiki_news_label
                label: どうでもいいWikipedia見出し
                type: string
              - name: wiki_news_refresh_label
                label: Wikipedia引き直しボタン
                type: string
              - name: wiki_news_loading_title
                label: Wikipedia読込中タイトル
                type: string
              - name: wiki_news_loading_text
                label: Wikipedia読込中本文
                type: string
              - name: wiki_news_link_label
                label: Wikipediaリンク文言
                type: string
              - name: wiki_news_unknown_title
                label: Wikipedia題名不明文言
                type: string
              - name: wiki_news_unknown_text
                label: Wikipedia説明なし文言
                type: string
              - name: wiki_news_meta_text
                label: Wikipedia出典文言
                type: string
              - name: wiki_news_error_title
                label: Wikipediaエラー見出し
                type: string
              - name: wiki_news_error_text
                label: Wikipediaエラー本文
                type: text
              - name: globe_title
                label: 地球儀の見出し
                type: string
              - name: globe_aria_label
                label: 地球儀の説明
                type: string
              - name: globe_expanded_aria_label
                label: 地球儀拡大中の説明
                type: string
              - name: globe_note
                label: 地球儀の注意書き
                type: text
              - name: globe_loading_text
                label: 地球儀読込中
                type: string
              - name: globe_controls_aria_label
                label: 地球儀操作欄の読み上げ名
