  - name: diary
    label: 日記
    type: collection
    path: _posts
    format: yaml-frontmatter
    exclude: ["README.md"]
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    operations:
      create: true
      rename: false
      delete: true
    view:
      primary: title
      fields: [title]
      search: [title]
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: body
        label: 本文
        type: rich-text
        required: true
        options:
          format: markdown
          media: diary_images
          switcher: true

  - name: shorts
    label: ひとこと
    type: collection
    path: _shorts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    operations:
      create: true
      rename: false
      delete: true
    fields:
      - name: body
        label: 本文
        type: text
        required: true

  - name: shorts_page
    label: ひとことページ設定
    type: file
    path: _data/shorts.yml
    format: yaml
    fields:
      - name: title
        label: ページ見出し
        type: string
        required: true
      - name: intro
        label: 説明
        type: text
      - name: empty_text
        label: 何もない時の文言
        type: string

  - name: photos
    label: 写真
