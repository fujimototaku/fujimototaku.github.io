        label: ページ見出し
        type: string
        required: true
      - name: intro
        label: 説明
        type: text
      - name: items
        label: 写真
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: 写真
            type: image
            required: true
            options:
              media: site_images
          - name: caption
            label: 一言
            type: text
          - name: place
            label: 場所
            type: string

  - name: movies
    label: 映画
    type: file
    path: _data/movies.yml
    format: yaml
    fields:
