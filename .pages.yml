            required: true
          - name: description
            label: 一言説明
            type: text
          - name: image
            label: スクリーンショット
            type: image
            options:
              media: site_images
          - name: status
            label: 状態
            type: string
            description: 公開 / 実験中 / 停止中 など。空欄でもOK
          - name: url
            label: 起動URL
            type: string

settings:
  content:
    merge: true
  commit:
    templates:
      create: "追加: {filename}"
      update: "更新: {filename}"
      delete: "削除: {filename}"
      rename: "改名: {oldPath} -> {newPath}"
