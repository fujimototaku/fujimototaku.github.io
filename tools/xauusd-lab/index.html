<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAU/USD Daytrade Lab</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:980px;margin:auto;padding:24px;background:#f7f7f7;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.controls{display:flex;flex-wrap:wrap;gap:10px}.controls label{display:flex;flex-direction:column;font-size:13px}.controls input,button{padding:8px;border:1px solid #bbb;border-radius:7px}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:7px;border-bottom:1px solid #eee;text-align:right}td:first-child,th:first-child{text-align:left}.bad{color:#a00}.good{color:#176b35}</style></head><body><h1>XAU/USD Daytrade Lab</h1><p>自動取得したXAU/USDデータをブラウザで検証。初期ベースラインはEMAクロス＋ATRストップ/利確。</p><div class="controls"><label>初期資金<input id="capital" type="number" value="100000"></label><label>リスク%<input id="risk" type="number" value="0.5" step="0.1"></label><label>ATR stop<input id="stop" type="number" value="1.5" step="0.1"></label><label>ATR target<input id="target" type="number" value="3" step="0.5"></label><label>EMA fast<input id="fast" type="number" value="20"></label><label>EMA slow<input id="slow" type="number" value="50"></label><button id="run">検証実行</button></div><div id="summary" class="grid"></div><div class="card"><h2>直近トレード</h2><table><thead><tr><th>Entry</th><th>Exit</th><th>Side</th><th>P/L</th><th>Reason</th></tr></thead><tbody id="trades"></tbody></table></div><script src="app.js"></script></body></html>
