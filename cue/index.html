<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe5"><meta name="apple-mobile-web-app-capable" content="yes"><title>Cue</title><style>:root{--bg:#f4efe5;--paper:#fffdf8;--ink:#171815;--muted:#77746c;--line:#d9d1c4;--accent:#7b2f2b;--green:#2f5b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}.app{max-width:680px;margin:auto;padding:18px 15px 50px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;min-height:54px;margin-bottom:18px}.logo{font:500 36px Georgia,serif}button,textarea{font:inherit}button{cursor:pointer}.plain{border:0;background:none;font-weight:800}.card{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;padding:20px;margin-bottom:14px}.hero{min-height:62vh;display:grid;place-items:center;text-align:center}.hero h1,.role h1,.finish h1{font:500 38px/1.2 Georgia,serif;margin:0 0 10px}.muted{color:var(--muted);line-height:1.6}.primary,.secondary{width:100%;border-radius:15px;padding:15px 16px;font-weight:900}.primary{border:1px solid var(--ink);background:var(--ink);color:#fff}.secondary{border:1.5px solid var(--line);background:var(--paper);color:var(--ink)}.methods{display:grid;gap:10px}.method{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:18px;text-align:left;font-weight:900}.method small{display:block;color:var(--muted);margin-top:5px;font-weight:500}.script{width:100%;height:56vh;min-height:320px;border:1.5px solid var(--line);background:var(--paper);border-radius:18px;padding:15px;line-height:1.7;font-size:16px}.roles{display:grid;gap:8px;margin:20px 0}.roleBtn{width:100%;display:flex;justify-content:space-between;border:1.5px solid var(--line);background:var(--paper);border-radius:15px;padding:15px;font-weight:900}.roleBtn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode{border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px;font-weight:900;min-height:75px}.mode small{display:block;color:var(--muted);font-weight:500;margin-top:5px}.cue{font-size:21px;line-height:1.65;white-space:pre-wrap}.speaker{font-size:12px;font-weight:900;color:var(--accent);margin-bottom:6px}.prompt{min-height:150px;display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line);border-radius:20px;color:var(--muted);font-size:19px;font-weight:800;padding:18px}.answer{font-size:23px;line-height:1.7;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.progress{height:3px;background:#ddd5c8;margin:6px 0 20px}.progress i{display:block;height:100%;background:var(--accent);width:0}.judge{padding:15px;border-radius:14px;font-weight:900}.fail{border:1.5px solid #caa69d;background:#fff7f4;color:#8e4037}.pass{border:1px solid var(--green);background:var(--green);color:white}.scene{font-size:11px;color:var(--muted);margin-bottom:8px}.stats{font-size:12px;color:var(--muted);margin-top:14px}.finish{text-align:center;padding-top:18vh}.finish .primary{margin-top:18px}@media(max-width:430px){.modes{gap:6px}.mode{font-size:13px}.logo{font-size:34px}}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script></head><body><main class="app"><header class="top"><div class="logo">Cue</div><button id="back" class="plain hidden">戻る</button></header><section id="import"><div id="landing" class="hero"><div><h1>台本を追加</h1><p class="muted">自分の役だけ、思い出す練習。</p><button id="open" class="primary">台本を追加</button></div></div><div id="methods" class="hidden"><div class="methods"><label class="method">PDFから読み込む<small>端末内で文字を取り出します</small><input id="file" type="file" accept="application/pdf,text/plain" hidden></label><button id="pasteOpen" class="method">台本を貼り付ける<small>役名：セリフ の形だと確実</small></button></div></div><div id="paste" class="hidden"><textarea id="text" class="script" placeholder="例：\n太郎：今日はどうする？\n花子：帰ろう。"></textarea><button id="parse" class="primary" style="margin-top:10px">読み取る</button></div></section><section id="role" class="hidden role"><h1>自分の役を選ぶ</h1><p id="sum" class="muted"></p><div id="roles" class="roles"></div><button id="roleOk" class="primary" disabled>この役で始める</button></section><section id="home" class="hidden"><div class="card"><div class="muted" id="meta"></div><h1 id="homeTitle" style="font:500 34px Georgia,serif;margin:7px 0 8px">続きから稽古</h1><p id="homeDesc" class="muted"></p><button id="main" class="primary">始める</button><div id="stats" class="stats"></div></div><div class="modes"><button class="mode" data-mode="through">最初から<small>通して</small></button><button class="mode" data-mode="weak">苦手だけ<small>失敗優先</small></button><button class="mode" data-mode="random">ランダム<small>途中から</small></button></div></section><section id="practice" class="hidden"><div class="progress"><i id="bar"></i></div><div class="scene" id="scene"></div><div class="card"><div class="speaker" id="speaker"></div><div class="cue" id="cue"></div><button id="speak" class="secondary" style="margin-top:14px">相手のセリフを読む</button></div><div id="recall" class="prompt">自分のセリフを言ってみる</div><div id="hintText" class="prompt hidden"></div><div class="row" style="margin-top:10px"><button id="hint" class="secondary">ヒント</button><button id="reveal" class="primary">答えを見る</button></div><div id="answerCard" class="card hidden" style="margin-top:12px"><div class="answer" id="answer"></div><div class="row" style="margin-top:18px"><button id="no" class="judge fail">言えなかった</button><button id="yes" class="judge pass">言えた</button></div></div></section><section id="finish" class="hidden finish"><h1>おつかれさま</h1><p id="finishText" class="muted"></p><button id="finishHome" class="primary">戻る</button></section></main><script>(()=>{const K='cue-theatre-v5';let project=null,draft=null,sel='',session=null;const $=id=>document.getElementById(id),views=['import','role','home','practice','finish'];try{project=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}function show(v){views.forEach(x=>$(x).classList.toggle('hidden',x!==v));$('back').classList.toggle('hidden',v==='home'||v==='import'&&!project);scrollTo(0,0)}function save(){if(project)localStorage.setItem(K,JSON.stringify(project))}function clean(s){return s.replace(/\r/g,'').replace(/[\u00a0\u3000]/g,' ').trim()}function parseScript(raw){let turns=[],counts={},scene='';for(const line0 of clean(raw).split('\n')){let s=line0.trim();if(!s)continue;if(/^(第?.{0,8}(場|幕|景)|scene\b|【.*】)$/i.test(s)){scene=s;continue}let m=s.match(/^([^：:]{1,20})[：:]\s*(.+)$/);if(m){let role=m[1].trim(),text=m[2].trim();turns.push({role,text,scene});counts[role]=(counts[role]||0)+1}else if(turns.length){turns[turns.length-1].text+='\n'+s}}return{raw:clean(raw),turns,roles:Object.entries(counts).sort((a,b)=>b[1]-a[1])}}function units(){if(!project)return[];let out=[];for(let i=0;i<project.turns.length;i++){let t=project.turns[i];if(t.role!==project.role)continue;let cue={role:'',text:'ここから始める'};for(let j=i-1;j>=0;j--){if(project.turns[j].scene!==t.scene&&project.turns[j].scene)break;if(project.turns[j].role!==project.role){cue=project.turns[j];break}}out.push({key:i+'|'+t.text,index:i,scene:t.scene,cue,target:t.text})}return out}function stat(k){project.stats[k]??={clean:0,fail:0,hint:0,strength:0,nextAt:0};return project.stats[k]}function due(u){return stat(u.key).nextAt<=Date.now()}function weak(){return units().filter(u=>{let s=stat(u.key);return s.fail||s.hint||s.strength<2}).sort((a,b)=>stat(b.key).fail-stat(a.key).fail)}function prepare(raw,name='台本'){draft=parseScript(raw);draft.title=name;sel='';if(!draft.roles.length){alert('役名を読み取れませんでした。「役名：セリフ」の形で試してください。');return}$('sum').textContent=draft.roles.length+'役・'+draft.turns.length+'台詞を読み取りました';$('roles').innerHTML='';draft.roles.forEach(([r,c])=>{let b=document.createElement('button');b.className='roleBtn';b.innerHTML='<span></span><small></small>';b.children[0].textContent=r;b.children[1].textContent=c+'本';b.onclick=()=>{sel=r;[...$('roles').children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('roleOk').disabled=false};$('roles').appendChild(b)});show('role')}async function pdf(file){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let p=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,arr=[];for(let i=1;i<=p.numPages;i++){let pg=await p.getPage(i),c=await pg.getTextContent(),rows={};for(const it of c.items){let y=Math.round((it.transform?.[5]||0)/3)*3;(rows[y]??=[]).push({x:it.transform?.[4]||0,t:it.str})}arr.push(Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.x-b.x).map(z=>z.t).join(' ')).join('\n'))}return arr.join('\n')}function renderHome(){let all=units(),d=all.filter(due);$('meta').textContent=project.role+' ・ '+project.title;if(d.length){$('homeTitle').textContent='復習 '+Math.min(d.length,10)+'本';$('homeDesc').textContent='今思い出すと、残りやすい台詞です。';$('main').dataset.mode='review';$('main').textContent='復習する'}else{$('homeTitle').textContent='続きから稽古';$('homeDesc').textContent=(project.resume+1)+' / '+all.length+' から';$('main').dataset.mode='continue';$('main').textContent='始める'}$('stats').textContent='自分の台詞 '+all.length+'本 ・ 苦手 '+weak().filter(u=>stat(u.key).fail||stat(u.key).hint).length+'本'}function begin(mode){let all=units(),q;if(mode==='review'){q=all.filter(due).slice(0,10);if(!q.length)q=weak().slice(0,10)}else if(mode==='weak'){q=weak().slice(0,12)}else if(mode==='random'){q=[...all].sort(()=>Math.random()-.5).slice(0,12)}else if(mode==='through')q=all;else{let s=Math.min(project.resume||0,Math.max(0,all.length-1));q=[...all.slice(s),...all.slice(0,s)].slice(0,12)}if(!q.length)return alert('稽古する台詞がありません');session={mode,q,pos:0,ok:0,fail:0,hint:false};show('practice');renderPractice()}function cur(){return session.q[session.pos]}function renderPractice(){let u=cur();$('bar').style.width=(session.pos/session.q.length*100)+'%';$('scene').textContent=u.scene||'';$('speaker').textContent=u.cue.role;$('cue').textContent=u.cue.text;$('recall').classList.remove('hidden');$('hintText').classList.add('hidden');$('answerCard').classList.add('hidden');session.hint=false}function grade(ok){let u=cur(),s=stat(u.key);if(ok){s.clean++;s.strength=Math.min(6,s.strength+1);s.nextAt=Date.now()+[1,3,7,14,30,60][Math.max(0,s.strength-1)]*864e5;session.ok++}else{s.fail++;s.strength=Math.max(0,s.strength-1);s.nextAt=Date.now()+10*60e3;session.fail++;if(!session.q.slice(session.pos+1).some(x=>x.key===u.key))session.q.splice(Math.min(session.q.length,session.pos+3),0,u)}if(session.hint)s.hint++;let all=units(),idx=all.findIndex(x=>x.key===u.key);if(idx>=0)project.resume=(idx+1)%Math.max(1,all.length);save();session.pos++;if(session.pos>=session.q.length){$('finishText').textContent='言えた '+session.ok+'本'+(session.fail?' ・ 言えなかった '+session.fail+'回':'');show('finish');renderHome()}else renderPractice()}$('open').onclick=()=>{$('landing').classList.add('hidden');$('methods').classList.remove('hidden')};$('pasteOpen').onclick=()=>{$('methods').classList.add('hidden');$('paste').classList.remove('hidden')};$('parse').onclick=()=>prepare($('text').value);$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{prepare(/\.pdf$/i.test(f.name)?await pdf(f):await f.text(),f.name.replace(/\.[^.]+$/,''))}catch(err){alert('PDFを読み取れませんでした。台本を貼り付けて試してください。')}};$('roleOk').onclick=()=>{project={title:draft.title||'台本',raw:draft.raw,role:sel,turns:draft.turns,stats:{},resume:0};save();renderHome();show('home')};$('main').onclick=()=>begin($('main').dataset.mode||'continue');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>begin(b.dataset.mode));$('hint').onclick=()=>{let t=cur().target,n=Math.max(4,Math.ceil([...t].length*.25));$('hintText').textContent=[...t].slice(0,n).join('')+'…';$('recall').classList.add('hidden');$('hintText').classList.remove('hidden');session.hint=true};$('reveal').onclick=()=>{$('answer').textContent=cur().target;$('answerCard').classList.remove('hidden')};$('yes').onclick=()=>grade(true);$('no').onclick=()=>grade(false);$('speak').onclick=()=>{if(!('speechSynthesis'in window))return;let x=new SpeechSynthesisUtterance(cur().cue.text);x.lang='ja-JP';x.rate=.94;speechSynthesis.cancel();speechSynthesis.speak(x)};$('finishHome').onclick=()=>{renderHome();show('home')};$('back').onclick=()=>{if(project){renderHome();show('home')}else show('import')};if(project){renderHome();show('home')}else show('import')})();</script></body></html>
