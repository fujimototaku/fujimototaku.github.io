  - title: 日記のおかげで正しく狂えた１
    image: /media/site/hkgysyza8aab7ao.jpeg
    description: |-
      ◼️内容

      2024年、2025年の日記です。生活の断片と大切な人とあらゆるポップカルチャーに支えられながら足掻いた痕跡です。この狂った世界が、あかるい方角に向かうことを願いながら書きました。たぶん。

      旧式から中身は細かいところを色々修正しました。

      ▼参考資料
      https://note.com/fujimototaku

      ◼️仕様

      ・148mm 148mm
      ・192ページ
      ・ホログラムスターダスト（なんだかキラキラしている。）
      ・2段組
      ・2024・2025年の日記のような何か
      ・4刷目から新装版（内容を多量に微修正、大修正してます）
      ・旧式はなくなったら絶版
      ・1,000円（値段つけたくなさすぎる。仕方がない。）
      ・半透明栞

      ◼️寄稿者

      鵜飼ヨシキ「夢の中の彼女」
      ササキアイ「すべての夜とカレーと日記」
      私説図書館祝日　佐々木夕方「たしかにひらいた」
      田中晃子「劇場の周辺にある記憶『シビル・ウォー』ほんの少し『SUPER HAPPY FOREVER』」
      はら「感光」
      本と喫茶NOMADOBOOKS　森田千琴「波紋を見つめる」
      屋良朝哉「生活、社会、人生に殺されないために」

      ◼️半透明栞

      まいたけ（短歌）
      もちだころ（デザイン・イラスト）
